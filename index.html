s('Menschen gehören dazu.', 'Hausverwaltung ist Büroarbeit und Arbeit mit Menschen. Zuhören, klar antworten und verlässlich nachhalten sind genauso wichtig wie Zahlen.', 'Eine Bewohnerin fragt zum dritten Mal nach einer Reparatur.', 'Welche Antwort hilft?', ['„Keine Ahnung.“','„Nicht mein Problem.“','„Der Termin ist noch offen. Ich frage beim Betrieb nach und melde mich morgen.“'],2,'Du nennst den tatsächlichen Stand und einen konkreten nächsten Schritt. Zusagen müssen realistisch sein.')]),
m('Wer wohnt, wer entscheidet?',['Mieter nutzen eine Wohnung aufgrund eines Mietvertrags.','Eigentümer besitzen; die Verwaltung handelt in deren Auftrag.','Wohnungseigentum und ein vermietetes Haus brauchen unterschiedliche Abläufe.'],[
s('Mieter und Eigentümer.', 'Mieter zahlen für die Nutzung einer Wohnung. Eigentümer besitzen sie. Eine Person kann Eigentümer einer Wohnung sein und sie vermieten.', 'Frau Berger besitzt Top 7. Herr Ali wohnt dort zur Miete.', 'Wer ist der Vermieter?', ['Frau Berger.','Herr Ali.','Automatisch die Hausverwaltung.'],0,'Frau Berger ist in diesem Beispiel Vermieterin. Die Hausverwaltung kann sie vertreten, wird dadurch aber nicht selbst Vermieterin.'),
s('Ein Haus, mehrere Eigentümer.', 'Bei Wohnungseigentum gehören einzelne Wohnungen verschiedenen Personen. Über gemeinsame Angelegenheiten entscheidet die Eigentümergemeinschaft nach den gesetzlichen Regeln.', 'Mehrere Eigentümer wollen das gemeinsame Dach reparieren.', 'Welche Welt betrifft das?', ['Nur den Mietvertrag einer Wohnung.','Wohnungseigentum und die gemeinsame Liegenschaft.','Den Verkauf einer einzelnen Wohnung.'],1,'Das Dach ist normalerweise ein gemeinsamer Teil. Verwaltung, Entscheidung und Kostentragung müssen nach WEG und den geltenden Vereinbarungen geprüft werden.'),
s('Die Verwaltung ist die Drehscheibe.', 'Die Verwaltung verbindet Eigentümer, Bewohner, Firmen und Behörden. Sie hat trotzdem nicht für alles eine Entscheidungsbefugnis.', 'Ein Mieter verlangt, dass du seine Nachbarin sofort aus ihrer Wohnung wirfst.', 'Was machst du?', ['Die Schlösser austauschen.','Eine Kündigung versprechen.','Den Sachverhalt aufnehmen, prüfen und an die zuständige Stelle weitergeben.'],2,'Ein Konflikt rechtfertigt keine eigenmächtige Räumung. Kündigung und Räumung haben rechtliche Voraussetzungen.')]),
m('Die Regeln für dein Haus',['MRG betrifft viele Mietverhältnisse, aber nicht alle gleich.','ABGB, WGG und WEG können ebenfalls wichtig sein.','Prüfe Haus und Vertrag, bevor du eine rechtliche Antwort gibst.'],[
s('Nicht jedes Haus ist gleich.', 'Das Mietrechtsgesetz heißt kurz MRG. Je nach Gebäude und Mietverhältnis gilt es ganz, teilweise oder gar nicht. Auch andere Regeln können gelten.', 'Zwei Wiener Wohnungen haben verschiedene Baujahre und Eigentumsverhältnisse.', 'Gilt sicher dieselbe Mietregel?', ['Ja, Wien ist überall gleich.','Nein. Zuerst den Anwendungsbereich prüfen.','Nur die Wohnungsgröße zählt.'],1,'Unter anderem Baugeschichte, Förderung, Eigentumsform und Ausnahmen können entscheidend sein. „Altbau = alles klar“ reicht nicht.'),
s('Vier Namen reichen fürs Erste.', 'MRG: Mietrecht. WEG: Wohnungseigentum. WGG: gemeinnütziger Wohnbau. ABGB: allgemeine Regeln für Verträge und vieles mehr.', 'Du verwaltest eine Eigentümergemeinschaft und organisierst einen Beschluss.', 'Welches Gesetz ist besonders wichtig?', ['WEG.','Nur das MRG.','Die Straßenverkehrsordnung.'],0,'Für die Eigentümergemeinschaft ist das WEG zentral. Für einen Mietvertrag in einer Eigentumswohnung können zusätzlich andere Regeln wichtig sein.'),
s('Nachschauen ist eine Stärke.', 'Das RIS ist die öffentliche österreichische Rechtsdatenbank. Für echte Fälle brauchst du die aktuelle Regel und manchmal fachliche Beratung.', 'Ein Eigentümer fragt nach einer komplizierten Mietzinserhöhung.', 'Was ist professionell?', ['Eine Zahl raten.','Einen alten Internetbeitrag ungeprüft übernehmen.','Vertrag, anwendbares Recht und aktuelle Regel prüfen.'],2,'Du musst nicht jeden Paragraphen auswendig kennen. Entscheidend ist, Grenzen zu erkennen und verlässlich zu prüfen.')]),
m('Mietvertrag & Übergabe',['Prüfe Vertrag, Parteien, Wohnung, Kosten und Befristung.','Dokumentiere Zustand, Schlüssel und Zähler bei der Übergabe.','Kaution und Miete erfüllen unterschiedliche Zwecke.'],[
s('Der Vertrag ist deine Grundlage.', 'Im Mietvertrag stehen unter anderem die Wohnung, die Vertragsparteien, der Mietzins und gegebenenfalls die Dauer. Nicht jede vereinbarte Klausel ist automatisch gültig.', 'Ein neuer Vertrag enthält eine Befristung.', 'Was musst du prüfen?', ['Nur die Unterschrift.','Die rechtlichen Anforderungen an diese konkrete Befristung.','Ob das Papier schön aussieht.'],1,'Form und zulässige Dauer können vom anwendbaren Recht abhängen. Deshalb enthält dieser Einstieg keine pauschale Mindestdauer für alle Fälle.'),
s('Übergabe ohne spätere Rätsel.', 'Ein Übergabeprotokoll hält den Zustand fest. Dazu gehören vorhandene Schäden, Schlüssel, Zählerstände und möglichst aussagekräftige Fotos.', 'Bei der Übergabe hat eine Tür bereits eine tiefe Schramme.', 'Was ist sinnvoll?', ['Den Schaden gemeinsam dokumentieren.','So tun, als wäre nichts.','Sofort die Kaution einbehalten.'],0,'Eine nachvollziehbare Dokumentation schützt beide Seiten. Zustand und Zeitpunkt sind später oft wichtiger als Erinnerungen.'),
s('Kaution ist eine Sicherheit.', 'Die Kaution sichert berechtigte Ansprüche aus dem Mietverhältnis. Sie ist kein frei verfügbares Extra für den laufenden Hausbetrieb.', 'Ein Mieter zieht aus. Du findest keine offenen Forderungen oder ersatzpflichtigen Schäden.', 'Was ist grundsätzlich zu veranlassen?', ['Die Kaution für das nächste Dach sparen.','Die Kaution als letzte Miete ansehen.','Die Rückzahlung nach Prüfung samt anwendbaren Zinsen.'],2,'Normale Abnutzung ist nicht einfach ein Schadenersatzfall. Bei Abzügen müssen Rechtsgrund und Höhe nachvollziehbar sein.')]),
m('Miete, Kosten & Geld',['Trenne Hauptmietzins, laufende Kosten und andere Entgelte.','Zahlungen gehören nachvollziehbar zum richtigen Konto.','Offene Zahlungen werden geprüft und geordnet bearbeitet.'],[
s('Eine Zahlung, mehrere Teile.', 'Die monatliche Vorschreibung ist die Zahlungsaufforderung. Sie kann Hauptmietzins, Betriebskosten und weitere Positionen enthalten.', 'Im Rechenbeispiel stehen 600 € Hauptmietzins und 150 € Betriebskosten. Weitere Positionen lassen wir hier weg.', 'Wie viel ergibt das zusammen?', ['600 €.','750 €.','900 €.'],1,'600 + 150 = 750 €. Im echten Fall können zum Beispiel Umsatzsteuer oder weitere Entgelte dazukommen. Prüfe immer die einzelnen Positionen.'),
s('Geld muss zuordenbar sein.', 'Eine gute Buchhaltung zeigt, wer was bezahlt hat und wofür Geld ausgegeben wurde. Hausgelder und eigene Geschäftsgelder bleiben getrennt.', 'Eine Zahlung kommt ohne klare Angabe zur Wohnung an.', 'Was machst du?', ['Zahlung anhand von Daten klären und richtig zuordnen.','Dem ersten Mieter gutschreiben.','Die Zahlung ignorieren.'],0,'Saubere Zuordnung verhindert falsche Mahnungen. Rechnung, Buchung und Kontoauszug müssen zusammenpassen.'),
s('Wenn eine Zahlung fehlt.', 'Ein Rückstand muss erst stimmen, bevor du jemanden mahnst. Prüfe Fälligkeit, Zahlungseingang und Zuordnung.', 'Das System zeigt eine offene Miete. Der Mieter sagt, er habe überwiesen.', 'Was kommt zuerst?', ['Sofort die Schlösser tauschen.','Automatisch kündigen.','Konto und Zahlungsbeleg prüfen.'],2,'Manchmal wurde eine Zahlung falsch zugeordnet. Weitere Schritte brauchen einen korrekten Sachverhalt und den rechtlich passenden Ablauf.')]),
m('Betriebskosten verstehen',['Betriebskosten sind bestimmte laufende Hauskosten.','Reparaturen sind nicht automatisch Betriebskosten.','Welche Position zulässig ist, hängt vom Rechtsrahmen ab.'],[
s('Das Haus kostet im Alltag Geld.', 'Wasser, Müllabfuhr und bestimmte Kosten der Hausbetreuung sind typische Betriebskosten. Welche Kosten verrechnet werden dürfen, hängt vom geltenden Recht ab.', 'Für das Haus kommt die Rechnung der Müllabfuhr.', 'Was ist das typischerweise?', ['Ein Kaufpreis für eine Wohnung.','Eine laufende Betriebskostenposition.','Die Kaution eines Mieters.'],1,'Müllabfuhr ist eine typische Betriebskostenposition. Verteilung und Abrechnung müssen zum Rechtsrahmen des Hauses passen.'),
s('Reparatur ist nicht laufender Betrieb.', 'Im Vollanwendungsbereich des MRG gibt es einen gesetzlich geregelten Betriebskostenkatalog. Eine große Reparatur wird dadurch nicht einfach zur Betriebskostenposition.', 'Das Dach wird für 30.000 € repariert.', 'Darfst du das einfach als MRG-Betriebskosten verrechnen?', ['Nein. Die Finanzierung und zulässige Kostentragung gesondert prüfen.','Ja, jede Hausrechnung ist eine Betriebskostenrechnung.','Ja, wenn der Betrag hoch ist.'],0,'Erhaltung und Betriebskosten sind verschiedene Themen. Außerhalb dieses MRG-Rahmens musst du ebenfalls Vertrag und Recht prüfen.'),
s('Nicht nach Bauchgefühl verteilen.', 'Ein Verteilungsschlüssel sagt, wie Kosten aufgeteilt werden. Er ergibt sich aus Gesetz und zulässigen Vereinbarungen, nicht aus persönlicher Sympathie.', 'Eine große und eine kleine Wohnung nutzen dasselbe Stiegenhaus.', 'Wie verteilst du die Kosten?', ['Beide zahlen immer exakt gleich.','Die lauteste Person zahlt mehr.','Nach dem für diese Kosten geltenden Verteilungsschlüssel.'],2,'Bei Mietwohnungen ist häufig die Nutzfläche wichtig. Bei Wohnungseigentum gelten eigene Regeln. Einzelne Kosten können anders verteilt werden.')]),
m('Abrechnung ohne Zahlenangst',['Vergleiche Vorauszahlungen und tatsächliche Kosten.','Eine Abrechnung braucht nachvollziehbare Belege.','Fristen hängen vom jeweiligen Rechtsrahmen ab.'],[
s('Was wurde wirklich ausgegeben?', 'Vorauszahlungen sind geschätzte Zahlungen im laufenden Jahr. In der Abrechnung vergleichst du sie mit den tatsächlichen, zulässigen Kosten.', 'Eine Wohnung hat 1.800 € vorausgezahlt. Ihr Kostenanteil beträgt im Beispiel 1.680 €.', 'Was ergibt sich rechnerisch?', ['120 € Guthaben.','120 € Nachzahlung.','1.680 € Nachzahlung.'],0,'1.800 − 1.680 = 120 € Guthaben. Wer den Saldo rechtlich erhält oder schuldet und wann, hängt vom konkreten Fall ab.'),
s('Eine Zahl braucht einen Beleg.', 'Eine prüfbare Abrechnung zeigt Kosten, Verteilung und Vorauszahlungen. Berechtigte Personen müssen nach den geltenden Regeln Belege einsehen können.', 'Eine Bewohnerin möchte die Wasserrechnung sehen.', 'Wie reagierst du?', ['„Das ist immer geheim.“','Das Einsichtsrecht prüfen und die Einsicht ordnungsgemäß ermöglichen.','Nur die Summe wiederholen.'],1,'Transparenz gehört zur Verwaltung. Bei Belegen beachtest du gleichzeitig den Schutz personenbezogener Daten.'),
s('Fristen gehören in den Kalender.', 'Abrechnungen sind keine Aufgabe für „irgendwann“. Im Vollanwendungsbereich des MRG ist die Betriebskostenabrechnung grundsätzlich bis 30. Juni für das Vorjahr zu legen.', 'Du verwaltest mehrere Häuser mit verschiedenen Rechtsrahmen.', 'Wie organisierst du die Termine?', ['Ein Datum für alle Fälle raten.','Warten, bis sich jemand beschwert.','Die jeweils geltenden Fristen je Haus prüfen und vormerken.'],2,'Auch das WEG und andere Regelungen kennen eigene Pflichten. Merke dir zuerst das Prinzip: Rechtsrahmen prüfen, Termin setzen, rechtzeitig vorbereiten.')]),
m('Eigentum & Rücklage',['Die Rücklage ist Geld für künftige Aufwendungen am Haus.','Eine Vorausschau macht kommende Kosten sichtbar.','Mieterbetriebskosten und Eigentümerkosten sind zu unterscheiden.'],[
s('Das Sparpolster des Hauses.', 'Bei Wohnungseigentum wird eine Rücklage für künftige Aufwendungen gebildet. Sie gehört zur Eigentümergemeinschaft und ist kein persönliches Sparbuch eines Eigentümers.', 'Die Eigentümer sparen regelmäßig Geld für künftige Arbeiten am Haus.', 'Wie heißt dieser Topf?', ['Kaution.','Rücklage.','Hauptmietzins.'],1,'Die Rücklage hilft, notwendige Aufwendungen zu finanzieren. Angemessene Höhe und gesetzliche Mindestvorgaben müssen aktuell geprüft werden.'),
s('Vorausdenken spart Überraschungen.', 'Die Verwaltung erstellt im Wohnungseigentum eine Vorausschau: Welche Arbeiten und Kosten sind absehbar? Wie passen sie zur Rücklage?', 'Das Dach ist alt. In einigen Jahren könnte eine Sanierung nötig sein.', 'Was hilft der Gemeinschaft?', ['Früh Zustand, möglichen Aufwand und Finanzierung darstellen.','Das Thema verheimlichen.','Erst bei einem Schaden über Geld sprechen.'],0,'Eine Vorausschau ist keine Garantie für jede künftige Rechnung. Sie macht planbare Belastungen früh sichtbar.'),
s('Eigentümerrechnung ist nicht Mieterrechnung.', 'Ein Eigentümer kann eine Wohnung vermieten. Trotzdem darf er nicht automatisch jede Zahlung an die Gemeinschaft an den Mieter weiterreichen.', 'Die Eigentümerin zahlt in die Rücklage ein.', 'Ist das automatisch eine MRG-Betriebskostenposition für ihren Mieter?', ['Ja, jede Eigentümerkostenposition.','Ja, wenn sie es möchte.','Nein. Umlagefähigkeit rechtlich gesondert prüfen.'],2,'Die Einzahlung in die Rücklage ist nicht einfach eine Betriebskostenposition nach dem MRG. Eigentümerkosten und zulässige Mieterkosten getrennt betrachten.')]),
m('Beschlüsse & Versammlung',['Über gemeinsame Themen entscheiden Eigentümer nach Regeln.','Mehrheiten richten sich nicht einfach nach der Zahl anwesender Köpfe.','Beschlüsse brauchen klare Information und Dokumentation.'],[
s('Ein Beschluss hat Spielregeln.', 'Bei Wohnungseigentum zählen gesetzliche Mehrheiten und die betroffenen Anteile. Es gibt unterschiedliche Anforderungen je nach Maßnahme.', 'Drei Personen im Stiegenhaus wollen spontan den Lift ersetzen.', 'Reicht das als sicher gültiger Beschluss?', ['Ja, wenn alle laut zustimmen.','Nein. Zuständigkeit, Abstimmungsverfahren und Mehrheit prüfen.','Ja, weil drei mehr als zwei ist.'],1,'Die Verwaltung muss die Maßnahme richtig einordnen und die geltenden Beschlussregeln beachten. Eine informelle Gruppe ersetzt das nicht.'),
s('Versammlung mit einem klaren Thema.', 'Gute Vorbereitung heißt: verständliche Tagesordnung, Informationen und die vorgeschriebene Einladung. Nicht jeder Bewohner ist stimmberechtigter Eigentümer.', 'Für die Eigentümerversammlung stehen zwei Angebote zur Dachreparatur bereit.', 'Was gehört in die Vorbereitung?', ['Maßnahme, Angebote, Kosten und Finanzierung verständlich darstellen.','Nur die Uhrzeit nennen.','Die Entscheidung vorher geheim festlegen.'],0,'Menschen können besser entscheiden, wenn sie die Konsequenzen verstehen. Einladungs- und Informationspflichten müssen zusätzlich eingehalten werden.'),
s('Nachher muss es nachvollziehbar sein.', 'Halte Beschlussinhalt und Abstimmung nachvollziehbar fest. Bekanntmachung und mögliche Anfechtungsfristen gehören ebenfalls zum Ablauf.', 'Eine Eigentümerin fragt, was genau beschlossen wurde.', 'Was hilft?', ['„Das weiß eh jeder.“','Eine persönliche Erinnerung.','Die ordnungsgemäße Beschlussdokumentation und Bekanntmachung.'],2,'Ein verständlicher, sauber dokumentierter Beschluss reduziert Streit. Für Wirksamkeit und Anfechtung gelten konkrete rechtliche Regeln.')]),
m('Reparatur oder Notfall?',['Zuerst Gefahr und Dringlichkeit klären.','Sichern, dokumentieren und geeignete Fachleute einschalten.','Wer Kosten trägt, ist eine eigene Prüfungsfrage.'],[
s('Wasser wartet nicht.', 'Bei akuter Gefahr hat Schutz Vorrang. Die Verwaltung muss Notfälle erkennen und Hilfe organisieren; Bewohner sollen sich nicht selbst gefährden.', 'Wasser tritt nahe elektrischen Anlagen aus.', 'Was ist zuerst wichtig?', ['Auf die nächste Versammlung warten.','Den Preis mehrerer Angebote vergleichen.','Bereich meiden, bei Gefahr Notruf/Fachhilfe einschalten und sicheren Zugang klären.'],2,'Keine Arbeiten an nassen elektrischen Anlagen selbst durchführen. Bei unmittelbarer Gefahr Feuerwehr 122 oder Euro-Notruf 112. Die genaue Hilfe richtet sich nach der Lage.'),
s('Ein kaputter Griff ist anders.', 'Nicht jede Störung ist ein Notfall. Du sammelst Ort, Ausmaß, Zeitpunkt und Fotos und klärst den nächsten Schritt.', 'Ein Fenstergriff im allgemeinen Gang klemmt. Es besteht keine akute Gefahr.', 'Was passt?', ['Problem aufnehmen, Zuständigkeit klären und Reparatur planen.','Sofort das gesamte Haus evakuieren.','Die Meldung löschen.'],0,'Die Dringlichkeit bestimmt das Tempo. Eine kleine Reparatur braucht trotzdem nachvollziehbare Bearbeitung.'),
s('Wer zahlt? Erst prüfen.', 'Erhaltungspflicht, Verursachung und Versicherungsdeckung sind unterschiedliche Fragen. Der Ort allein entscheidet nicht alles.', 'Ein Rohrschaden betrifft eine vermietete Wohnung.', 'Wer bezahlt sicher?', ['Immer der Mieter.','Das lässt sich erst nach Prüfung von Ursache, Zuständigkeit und Rechtslage sagen.','Immer die Versicherung.'],1,'Anlage, Schadensursache, Mietrechtsrahmen und Vertrag sind relevant. Hilfe organisieren und Kostentragung prüfen laufen oft parallel.')]),
m('Firmen & Versicherung',['Vergleiche Umfang, Preis und Qualität von Angeboten.','Ein Auftrag muss klar und befugt erteilt werden.','Versicherung ersetzt keine Schadenvermeidung.'],[
s('Billig ist nicht immer vergleichbar.', 'Zwei Angebote sind nur vergleichbar, wenn sie dieselbe Arbeit umfassen. Achte auf Mengen, Leistungen, Nebenkosten und Zeitplan.', 'Angebot A ist günstiger, enthält aber keine Entsorgung. B enthält sie.', 'Was machst du?', ['Immer A wählen.','Immer B wählen.','Gesamtumfang und Gesamtkosten vergleichbar machen.'],2,'Du brauchst eine begründete Entscheidung. Notwendige Freigaben und Beschlüsse bleiben zusätzlich zu beachten.'),
s('Ein Auftrag braucht Klarheit.', 'Was wird gemacht? Bis wann? Zu welchem Preis? Wer darf beauftragen? Halte das nachvollziehbar fest.', 'Eine Firma bietet telefonisch eine größere Zusatzleistung an.', 'Was ist sinnvoll?', ['Umfang, Preis und nötige Freigabe klären, bevor du zusagst.','„Machen Sie einfach alles.“','Ohne Rückfrage die Eigentümer belasten.'],0,'Gerade Zusatzarbeiten können Budgets sprengen. Eine klare Dokumentation hilft bei Abnahme und Rechnungskontrolle.'),
s('Schaden melden, Belege sichern.', 'Bei einem Schaden: weitere Schäden möglichst sicher verhindern, dokumentieren und die Versicherung nach den Vertragsvorgaben informieren.', 'Nach einem Wasserrohrbruch fragt die Versicherung nach Fotos und Rechnungen.', 'Was hilft?', ['Alle Belege entsorgen.','Fotos, Schadensverlauf und Kosten geordnet bereitstellen.','Ungeprüft vollständige Deckung versprechen.'],1,'Ob und wie viel gedeckt ist, ergibt sich aus Vertrag und Fall. Eine Hausversicherung zahlt nicht automatisch jeden Schaden.')]),
m('Kommunikation & Konflikte',['Nimm Anliegen ernst und bleibe sachlich.','Unterscheide Beobachtung, Behauptung und bewiesene Tatsache.','Nenne einen konkreten nächsten Schritt.'],[
s('Ärger erst einmal sortieren.', 'Hinter einer wütenden Nachricht steckt oft ein konkretes Problem. Frage nach Ort, Zeitpunkt, Dauer und Auswirkung.', 'Ein Bewohner schreibt: „Hier funktioniert NIE etwas!“', 'Welche Antwort hilft?', ['„Dann ziehen Sie halt aus.“','„Welche Störung meinen Sie genau und seit wann besteht sie?“','Die Nachricht öffentlich aushängen.'],1,'Du holst das Gespräch zurück zu überprüfbaren Fakten. Freundlich sein heißt nicht, jede Behauptung ungeprüft zu übernehmen.'),
s('Lärm: Fakten statt Lagerbildung.', 'Bei Beschwerden helfen konkrete Angaben. Welche Störung? Wann? Wie oft? Hausordnung und rechtliche Regeln sind danach zu prüfen.', 'Zwei Nachbarn werfen einander nächtlichen Lärm vor.', 'Was tust du zuerst?', ['Beide Schilderungen sachlich aufnehmen und den Ablauf klären.','Der sympathischeren Person glauben.','Sofort eine Räumung androhen.'],0,'Dokumentation und ruhige Kommunikation kommen vor voreiligen rechtlichen Schritten. Akute Gefahr ist natürlich gesondert zu behandeln.'),
s('Nicht mehr versprechen als möglich.', 'Du kannst einen nächsten Schritt zusagen, auch wenn die endgültige Lösung noch offen ist.', 'Ein Handwerker hat noch keinen Termin bestätigt.', 'Welche Nachricht ist ehrlich?', ['„Morgen ist garantiert alles fertig.“','„Die Firma ist schuld, Ende.“','„Ich kläre den Termin und gebe Ihnen am Freitag ein Update.“'],2,'Ein konkretes Update schafft Verlässlichkeit. Ein erfundener Fertigstellungstermin schafft neue Enttäuschung.')]),
m('Datenschutz & Dokumente',['Nur erforderliche Daten verarbeiten und gezielt weitergeben.','Berechtigungen und sichere Ablage schützen Bewohner.','Ein gut geführter Hausakt macht die Arbeit leichter.'],[
s('Ein Haus ist kein offenes Adressbuch.', 'Bewohnerdaten, Rückstände und Vertragsunterlagen sind personenbezogene Daten. Weitergabe braucht einen passenden Zweck und eine rechtliche Grundlage.', 'Jemand verlangt eine Liste aller Mietrückstände für das schwarze Brett.', 'Was machst du?', ['Die Liste für alle aushängen.','Die Daten nicht öffentlich offenlegen und die Anfrage rechtlich prüfen.','Zusätzlich Telefonnummern dazuschreiben.'],1,'Schulden einzelner Personen gehören nicht auf einen öffentlichen Aushang. Transparenz rechtfertigt keine unbegrenzte Datenweitergabe.'),
s('Der Handwerker braucht nicht alles.', 'Gib Dienstleistern nur Daten, die sie für den Auftrag brauchen, und beachte die geltenden Datenschutzpflichten.', 'Eine Firma braucht Zugang zu einer betroffenen Wohnung.', 'Welche Weitergabe ist passend?', ['Erforderliche Termin- und Kontaktdaten auf geklärter Grundlage.','Den gesamten Mietvertrag und alle Kontoauszüge.','Die Daten aller Bewohner im Haus.'],0,'Datensparsamkeit heißt: passend zum konkreten Auftrag. Art der Zusammenarbeit und notwendige Vereinbarungen ebenfalls prüfen.'),
s('Der Hausakt ist dein Gedächtnis.', 'Zum Haus gehören geordnete Verträge, Pläne, Beschlüsse, Rechnungen, Prüfnachweise und die Schadenhistorie. Zugriff und Aufbewahrung müssen geregelt sein.', 'Eine Kollegin übernimmt während deines Urlaubs.', 'Was erleichtert ihr die Arbeit?', ['Wichtige Infos nur in deinem Kopf.','Unbenannte Dateien auf einem privaten Gerät.','Ein geordneter Hausakt mit Bearbeitungsständen und Zuständigkeiten.'],2,'Dokumentation macht Arbeit übergabefähig. Aufbewahrungs- und Löschfristen müssen passend zur jeweiligen Unterlage festgelegt werden.')]),
m('Wien & laufender Hausbetrieb',['Hausbetreuung, Wartung und Sicherheit brauchen klare Zuständigkeiten.','Bei Beratung und Behörden zählt die Art des Anliegens.','Energiefragen verbinden Technik, Kosten und rechtliche Entscheidungen.'],[
s('Was regelmäßig passieren muss.', 'Reinigung, Wartung und gesetzliche Prüfungen gehören je nach Haus zum Betrieb. Ein Kalender und klare Verantwortlichkeiten helfen.', 'Das Haus hat einen Lift und gemeinsame technische Anlagen.', 'Was organisierst du?', ['Erforderliche Wartungen und Prüfungen mit zuständigen Fachleuten.','Prüfungen nur nach einem Unfall.','Dass Bewohner den Lift selbst reparieren.'],0,'Welche Pflichten und Intervalle gelten, musst du für die konkrete Anlage prüfen. Auch Winterdienst und Verkehrssicherheit brauchen verlässliche Organisation.'),
s('Wien hat Anlaufstellen.', 'Die Stadt Wien bietet Wohninformationen und Beratung. Für bestimmte wohnrechtliche Streitigkeiten gibt es die Schlichtungsstelle; nicht für jeden Konflikt ist sie zuständig.', 'Jemand will eine strittige Betriebskostenabrechnung überprüfen lassen.', 'Was ist sinnvoll?', ['Behaupten, dass nur die Polizei zuständig ist.','Passende Beratung und Zuständigkeit der Schlichtungsstelle prüfen.','Versprechen, dass jede Beschwerde dort entschieden wird.'],1,'Stadt Wien, Arbeiterkammer oder andere qualifizierte Beratungsstellen können den richtigen Weg klären. Die Zuständigkeit hängt vom konkreten Anliegen ab.'),
s('Sanierung braucht mehrere Blickwinkel.', 'Dämmung oder eine neue Heizung können Kosten und Verbrauch verändern. Technische Machbarkeit, Bewilligungen, Beschlüsse und Finanzierung gehören zusammen.', 'Ein Eigentümer will sofort eine neue Heizungsanlage bestellen.', 'Was braucht das Vorhaben zuerst?', ['Nur ein Werbeprospekt.','Nur eine Farbe.','Fachliche Planung sowie Prüfung von Entscheidung, Bewilligung und Finanzierung.'],2,'Förderungen und Vorgaben ändern sich. Aktuelle Wiener und österreichische Informationen prüfen, statt feste Förderbeträge auswendig zu lernen.')]),
m('Dein Weg in den Beruf',['Du kannst als Mitarbeiter oder Assistenz erste Erfahrungen sammeln.','Selbstständige Immobilienverwaltung ist ein reglementiertes Gewerbe.','Organisation, Kommunikation und Zahlenverständnis sind wichtige Grundlagen.'],[
s('Du darfst klein anfangen.', 'Für den Einstieg kommen zum Beispiel Assistenz, Sachbearbeitung oder Buchhaltung in einer Hausverwaltung infrage. Die Anforderungen hängen von der konkreten Stelle ab.', 'Du willst den Beruf kennenlernen, hast aber noch wenig Wissen.', 'Was ist ein realistischer nächster Schritt?', ['Einsteigerstellen anschauen und nach Aufgaben und Einschulung fragen.','So tun, als wärst du schon Experte.','Ohne Auftrag Häuser verwalten.'],0,'Du musst am ersten Arbeitstag nicht alles können. Eine klare Rolle, gute Einschulung und fachliche Begleitung helfen beim Lernen.'),
s('Angestellt oder selbstständig?', 'Selbstständige Immobilienverwaltung fällt in Österreich unter das reglementierte Gewerbe der Immobilientreuhänder. Berufszugang, Befähigung und weitere Pflichten sind zu prüfen.', 'Du möchtest eine eigene Hausverwaltung gründen.', 'Reicht dieser Kurs als Zulassung?', ['Ja, nach dem letzten Quiz.','Nein. Den konkreten Befähigungs- und Gewerbezugang bei WKO/Behörde klären.','Ja, wenn du eine Website hast.'],1,'Der Kurs schafft Orientierung. Er ersetzt weder den erforderlichen Befähigungsnachweis noch die Gewerbeberechtigung oder berufliche Pflichten.'),
s('Passt der Alltag zu dir?', 'Du wechselst zwischen Telefonaten, Zahlen, Dokumenten und unerwarteten Problemen. Sorgfalt und ruhiges Nachhalten zählen.', 'Dich interessieren Häuser. Konflikte und Büroarbeit findest du bisher weniger spannend.', 'Wie findest du heraus, ob es passt?', ['Nur schöne Fassaden anschauen.','Alle schwierigen Aufgaben dauerhaft ignorieren.','Gespräche mit Betrieben führen und nach Möglichkeit einen Einblick in den Alltag bekommen.'],2,'Frag nach einem typischen Arbeitstag, Betreuung, Lernmöglichkeiten und den Aufgaben der konkreten Stelle. Das ist aussagekräftiger als ein Berufsname.')]),
m('Dein kleiner Praxistag',['Gefahr zuerst, dann planbare Arbeit.','Prüfen, dokumentieren und verständlich kommunizieren.','Bei Rechtsfragen Grenzen erkennen und gezielt nachschauen.'],[
s('Montag, 8:30 Uhr.', 'Jetzt kombinierst du dein Wissen. Priorisieren heißt: zuerst Gefahr und drohende Schäden, danach andere wichtige Termine und Routine.', 'Im Postfach: eine Frage zur Kaution, ein Angebot und die Meldung „Wasser läuft im Keller nahe dem Stromkasten“.', 'Was hat zuerst Priorität?', ['Das günstigste Angebot.','Der mögliche Gefahrenfall im Keller.','Die Kautionsfrage.'],1,'Kläre die akute Lage und organisiere sichere Hilfe. Bei unmittelbarer Gefahr Notruf. Die anderen Anliegen bleiben erfasst und werden danach bearbeitet.'),
s('Montag, 11:00 Uhr.', 'Eine neue Rechnung ist noch keine Freigabe zur Zahlung. Du prüfst Bestellung, Leistung, Preis, Zuordnung und Befugnis.', 'Eine Firma verrechnet mehr als im Auftrag vereinbart. Eine Zusatzleistung ist nicht dokumentiert.', 'Was tust du?', ['Die Abweichung klären und die Rechnung nachvollziehbar prüfen.','Einfach bezahlen, damit es schnell geht.','Den Mehrbetrag ohne Prüfung als Mieterkosten buchen.'],0,'Prüfen ist keine Verzögerung um ihrer selbst willen. Du musst fremdes Geld sorgfältig verwalten und begründete Zahlungen sicherstellen.'),
s('Montag, 16:00 Uhr.', 'Am Tagesende zählen ein klarer Bearbeitungsstand und offene nächste Schritte. Du musst nicht jeden Fall sofort abschließen.', 'Der Notfall ist versorgt. Der Versicherung fehlen Unterlagen, eine Bewohnerin wartet auf ein Update.', 'Wie schließt du den Tag gut ab?', ['Offene Aufgaben vergessen.','Eine vollständige Lösung behaupten.','Stand dokumentieren, Unterlagen anfordern und ein ehrliches Update geben.'],2,'Genau das ist der Kern: Überblick halten, Zuständigkeiten klären und zuverlässig weiterarbeiten. Du hast die wichtigsten Grundlagen für deinen Einstieg geübt.')])
];
const TERMS={ 'Hausverwaltung':'Organisiert und betreut ein Haus im Auftrag der Eigentümer.', 'Liegenschaft':'Ein Grundstück samt den dazugehörigen Gebäuden.', 'Top':'Die Bezeichnung einer einzelnen Wohnung oder Geschäftseinheit, zum Beispiel Top 7.', 'Vorschreibung':'Die Mitteilung, wie viel und wofür du zu einem Termin zahlen sollst.', 'Hauptmietzins':'Das Entgelt für die Nutzung der gemieteten Wohnung, getrennt von weiteren Kosten.', 'Betriebskosten':'Bestimmte laufende Kosten eines Hauses, etwa Müllabfuhr. Was zulässig ist, hängt vom Recht ab.', 'Rücklage':'Gemeinsames Geld der Eigentümergemeinschaft für künftige Aufwendungen am Haus.', 'Kaution':'Eine Sicherheit für berechtigte Forderungen aus einem Mietverhältnis.', 'Nutzfläche':'Eine gesetzlich definierte Fläche. Sie ist nicht in jedem Zusammenhang einfach dieselbe Zahl wie im Inserat.', 'Verteilungsschlüssel':'Die Regel, nach der Kosten auf mehrere Einheiten oder Eigentümer verteilt werden.', 'Eigentümergemeinschaft':'Die Gemeinschaft der Wohnungseigentümer für die Verwaltung der gemeinsamen Liegenschaft.', 'Beschluss':'Eine Entscheidung der Eigentümer nach den dafür geltenden Regeln.', 'Erhaltung':'Arbeiten, die Gebäude oder Anlagen erhalten oder wieder in einen ordnungsgemäßen Zustand bringen.', 'MRG':'Mietrechtsgesetz. Gilt je nach Mietverhältnis ganz, teilweise oder nicht.', 'WEG':'Wohnungseigentumsgesetz. Regelt unter anderem Verwaltung und Entscheidungen im Wohnungseigentum.', 'WGG':'Wohnungsgemeinnützigkeitsgesetz. Wichtig bei gemeinnützigen Bauvereinigungen.', 'ABGB':'Allgemeines bürgerliches Gesetzbuch. Enthält viele allgemeine Regeln, unter anderem für Verträge.', 'RIS':'Rechtsinformationssystem des Bundes. Dort kannst du österreichische Gesetze nachlesen.' };

add('office-start','office','Dein Einstieg im Familienbetrieb',['Mitgehen hilft, Zusammenhänge zu sehen.','Aufgaben und Freigaben werden ausdrücklich vereinbart.','Echte Verwalterpraxis wird nachvollziehbar dokumentiert.'],'Begleite einen überschaubaren Fall von der Meldung bis zum Abschluss.',['Mitgehen','Mitmachen','Selbst bearbeiten'],'ris',[
n('Einen Fall ganz sehen.','Lerne zunächst an einem kleinen, realen Vorgang. Eine erfahrene Person erklärt die Schritte und prüft deine Arbeit.','Du unterstützt bei einer defekten Stiegenhausbeleuchtung.','Was zeigt dir den gesamten Ablauf?',['Nur die Rechnung verbuchen.','Meldung, Beauftragung und Rückmeldung gemeinsam verfolgen.','Alle offenen Fälle gleichzeitig übernehmen.'],1,'Ein ganzer kleiner Fall zeigt dir, wie Menschen, Unterlagen und Entscheidungen zusammenhängen. Technisches Wissen hilft, ersetzt aber die fachliche Einordnung nicht.'),
sort('Verantwortung wächst schrittweise.','Übernimm zuerst klar begrenzte Aufgaben. Eine Freigabe ist eine echte Prüfung, keine Formsache.','Du bereitest zum ersten Mal einen Handwerkerauftrag vor.',['Sachverhalt und vorgesehenen Auftrag vorbereiten.','Auftrag von der befugten Person prüfen und freigeben lassen.','Im vereinbarten Umfang ausführen und dokumentieren.'],'Das ist ein sinnvoller Lernablauf für einen planbaren Auftrag. In Notfällen gilt ein eigener, vorher geklärter Ablauf.'),
n('Praxis braucht einen Nachweis.','Für Verwalterpraxis zählen eigenständige kaufmännische und verwaltungstechnische Aufgaben. Reine IT-Arbeit ist nicht automatisch anerkennbare Verwaltungspraxis.','Du automatisierst den Posteingang und bearbeitest begleitet erste Verwaltungsfälle.','Was dokumentierst du für den späteren Gewerbezugang?',['Nur die Anzahl deiner Software-Commits.','Nur deine Zugehörigkeit zur Familie.','Zeitraum, konkrete Verwaltungsaufgaben und tatsächliche Verantwortung.'],2,'Lass früh mit WKO und Behörde klären, welche Tätigkeiten anerkannt werden können. Hospitation, IT-Projekte und fachliche Verwaltungspraxis müssen sauber unterschieden werden.')]);
add('office-file','office','Ein Hausakt zum Anfassen',['Haus, Einheit und Rechtsrahmen gehören zum Steckbrief.','Ein Hausakt braucht klare Ablage und Zuständigkeiten.','Fehlende Informationen werden geklärt statt ergänzt.'],'Erstelle einen anonymisierten Haus-Steckbrief mit einer erfahrenen Person.',['Haus','Einheit','Unterlage'],'mrg',[
match('Welche Unterlage hilft?','Verschiedene Unterlagen beantworten verschiedene Fragen. Suche gezielt statt den ganzen Hausakt zu lesen.','Du bereitest drei Rückfragen vor.',[['Wer mietet Top 4?','Mietvertrag'],['Was wurde beschlossen?','Beschlussprotokoll'],['Wie hoch war die Wasserrechnung?','Rechnungsbeleg']],'Der Mietvertrag beschreibt das Mietverhältnis. Das Beschlussprotokoll hält Entscheidungen fest. Der Rechnungsbeleg belegt konkrete Kosten.'),
n('Der Steckbrief vor der Antwort.','Ein Haus-Steckbrief sammelt Adresse, Eigentumsform, bekannte Baugeschichte, Betreuung und den geprüften Rechtsrahmen.','Im Steckbrief fehlt die Information zum anwendbaren Mietrecht.','Was ist sinnvoll?',['Den Rahmen mit fachlicher Hilfe prüfen und dokumentieren.','Aus der Wiener Adresse auf volle MRG-Anwendung schließen.','Den Vertrag ungeprüft als einzige Rechtsquelle nehmen.'],0,'Ein Steckbrief ist eine Orientierung, keine Rechtsprüfung für jeden Einzelfall. Fehlende Angaben bleiben als offene Frage sichtbar.'),
n('Stand statt Dateichaos.','Dokumente brauchen eine erkennbare Version, passende Zugriffsrechte und einen Bearbeitungsstand.','Du findest zwei unterschiedliche Vertragsentwürfe.','Was tust du?',['Die größere Datei als gültig ansehen.','Gültigen Stand und Freigabe klären.','Beide Versionen ohne Hinweis an den Mieter senden.'],1,'Datum, Status und Freigabe helfen. Eine vermeintlich aktuelle Datei ist noch kein unterschriebener oder gültiger Vertrag.')]);
add('office-bill','office','Rechnungen sorgfältig prüfen',['Auftrag, Leistung und Rechnung müssen zusammenpassen.','Abweichungen werden vor Zahlung geklärt.','Eine Freigabe setzt eine entsprechende Befugnis voraus.'],'Vergleiche einen anonymisierten Auftrag mit der dazugehörigen Rechnung.',['Auftrag','Leistung','Rechnung'],'wko',[
calc('Eine Abweichung erkennen.','Eine Rechnung wird mit dem vereinbarten Umfang verglichen. Ein Mehrbetrag kann berechtigt sein, braucht aber eine Erklärung.','Der Auftrag lautet im Beispiel auf 480 €. Die Rechnung beträgt 540 €. Beide Beträge verwenden dieselbe Steuerbasis.','Wie groß ist die Abweichung?',60,'540 − 480 = 60 €. Diese Differenz ist eine Rückfrage, nicht automatisch ein Fehler oder eine genehmigte Zusatzleistung.'),
sort('Vor der Zahlung.','Ein planbarer Zahlungsvorgang braucht Belegprüfung und die vereinbarte Freigabe.','Die Reparatur wurde erledigt. Du bereitest die Zahlung vor.',['Auftrag, erbrachte Leistung und Rechnungsbetrag vergleichen.','Abweichungen klären und nötige Freigabe einholen.','Zahlung im genehmigten Ablauf veranlassen und zuordnen.'],'Die Reihenfolge verhindert ungeprüfte Ausgaben. Wer freigeben und wer ausführen darf, bestimmt der konkrete Auftrag und Betriebsablauf.'),
n('Zwei Kontrollpunkte.','Bei größeren Zahlungen können getrennte Vorbereitung und Freigabe helfen. Die Rollen müssen trotzdem zur tatsächlichen Befugnis passen.','Du erfasst eine Rechnung über 8.000 €.','Welche Regel ist sinnvoll?',['Deine Datenerfassung ersetzt automatisch die Freigabe.','Eine zweite befugte Person prüft die Zahlung nach dem vereinbarten Ablauf.','Die Betragshöhe allein entscheidet, ob die Rechnung richtig ist.'],1,'Ein Vier-Augen-Ablauf ist ein Kontrollinstrument. Er ersetzt weder die Belegprüfung noch notwendige Eigentümerentscheidungen.')]);
add('office-cases','office','Meldungen & Fristen im Griff',['Jeder Vorgang braucht einen Bearbeitungsstand.','Verantwortliche Person und nächster Termin sind sichtbar.','Akute Gefahren haben Vorrang vor Routine.'],'Überführe drei anonymisierte Vorgänge in eine kleine Aufgabenliste.',['Person','Nächster Schritt','Termin'],'wien',[
n('Eine brauchbare Aufgabenliste.','Ein Vorgang braucht mindestens Anliegen, zuständige Person, nächsten Schritt und Termin.','Im System steht nur: „Fenster Top 2“.','Welche Ergänzung hilft am meisten?',['Ein farbiges Symbol ohne Beschreibung.','„Rückfrage zur Störung durch Anna bis Dienstag; Bewohner kontaktieren.“','Ein allgemeiner Termin für alle offenen Fälle.'],1,'Du weißt jetzt, wer als Nächstes was tun soll. Datensparsamkeit gilt auch in Aufgabenlisten.'),
sort('Der nächste Schritt ist sichtbar.','Eine Meldung verschwindet nicht nach dem Weiterleiten. Du prüfst später, ob die vereinbarte Handlung erfolgt ist.','Ein Fachbetrieb soll einen unverbindlichen Besichtigungstermin nennen.',['Anliegen aufnehmen und Zuständigkeit klären.','Terminrückmeldung mit zuständiger Person und Datum verfolgen.','Ergebnis dokumentieren und betroffene Person informieren.'],'Eine Weiterleitung ist noch keine Lösung. Nachhalten und Rückmeldung machen den Vorgang nachvollziehbar.'),
n('Frist oder Erinnerung?','Eine interne Erinnerung hilft beim Arbeiten. Eine gesetzliche Frist ergibt sich aus dem anwendbaren Recht.','Eine Kollegin trägt „bis Freitag“ für eine Rückfrage ein.','Ist das automatisch eine gesetzliche Frist?',['Ja, jeder Kalendereintrag hat rechtliche Wirkung.','Ja, sobald der Eintrag im Hausakt steht.','Nein. Rechtsgrund und gesetzliche Fristen gesondert prüfen.'],2,'Interne Termine und rechtliche Fristen getrennt kennzeichnen. Bei einer echten gesetzlichen Frist gehören Rechtsgrund und Verantwortlichkeit dazu.')]);
add('office-talk','office','Gespräche sicher vorbereiten',['Frage nach überprüfbaren Fakten.','Erklärungen sind kurz und sachlich.','Zusagen passen zu deinem tatsächlichen Wissen.'],'Formuliere eine Rückmeldung in drei Sätzen: Stand, nächster Schritt, Update-Termin.',['Stand','Nächster Schritt','Update'],'wien',[
n('Drei Sätze reichen.','Eine verständliche Rückmeldung nennt den Stand, die nächste Handlung und einen realistischen Update-Termin.','Ein Bewohner wartet auf eine Terminbestätigung.','Welche Nachricht ist am klarsten?',['„Wir bearbeiten Ihr Anliegen im üblichen Geschäftsgang.“','„Die Firma hat noch nicht bestätigt. Ich frage heute nach. Morgen erhalten Sie ein Update.“','„Der Schaden wird sicher morgen behoben.“'],1,'Die zweite Antwort ist konkret und verspricht nur das, was du organisieren kannst.'),
match('Fakt oder Einschätzung?','Trenne Beobachtungen von Vermutungen und Versprechen.','Du prüfst Formulierungen für einen Aktenvermerk.',[['„Wasserfleck wurde am Montag fotografiert.“','Beobachtung'],['„Vermutlich kommt das Wasser vom Dach.“','Vermutung'],['„Ich melde mich am Dienstag mit einem Update.“','Zusage']],'Eine Vermutung wird als solche markiert. Eine Zusage braucht einen realistischen Ablauf.'),
n('Eine Grenze freundlich erklären.','Wenn du nicht entscheiden darfst, kannst du trotzdem den nächsten Schritt organisieren.','Ein Eigentümer verlangt sofort eine verbindliche Kostenzusage. Du bist nicht dazu befugt.','Was sagst du?',['„Ich lasse Zuständigkeit und Kosten prüfen und melde mich mit dem nächsten Schritt.“','„Die Zusage gilt, wenn später niemand widerspricht.“','„Als Familienmitglied darf ich ohnehin entscheiden.“'],0,'Nähe zur Familie ersetzt keine Vertretungsbefugnis. Klare Grenzen helfen bei verlässlicher Zusammenarbeit.')]);
add('office-digital','office','Technik sinnvoll einsetzen',['Verstehe den Arbeitsablauf vor der Automatisierung.','Technik unterstützt, fachliche Freigabe bleibt sichtbar.','Mit anonymisierten Beispielen und kleinen Piloten beginnen.'],'Wähle einen kleinen wiederkehrenden Ablauf für einen beaufsichtigten Test.',['Verstehen','Klein testen','Prüfen'],'wko',[
n('Erst den Ablauf verstehen.','Deine technische Erfahrung hilft bei Struktur und Automatisierung. Fachliche Regeln klärst du mit den Verantwortlichen.','Du möchtest Mahnungen automatisch verschicken.','Was kommt zuerst?',['Versand direkt an alle als offen markierten Konten.','Datenqualität, Zahlungszuordnung und fachliche Freigabe klären.','Nur die Betreffzeile vereinheitlichen.'],1,'Ein technisch funktionierender Ablauf kann fachlich falsch sein. Starte mit einer überprüfbaren Vorschau statt automatischem Versand.'),
n('Üben mit geeigneten Daten.','Für einen technischen Test brauchst du meist keine echten Namen, Vertragsdaten oder Zahlungsrückstände.','Du probierst ein externes KI-Tool für den Posteingang aus.','Welche Daten eignen sich zum ersten Test?',['Anonymisierte oder vollständig erfundene Beispiele.','Den vollständigen Hausakt ohne Prüfung.','Echte Daten, wenn du das Tool privat zahlst.'],0,'Vor produktiver Nutzung müssen unter anderem Zweck, Rechtsgrundlage, Anbieterbedingungen und erforderliche Vereinbarungen geklärt werden.'),
sort('Ein kleiner Pilot.','Ein begrenzter Pilot zeigt, ob ein Werkzeug fachlich und praktisch hilft.','Eine neue Ansicht soll fehlende Rechnungsdaten anzeigen.',['Mit dem Team ein enges Ziel und Prüfkriterien festlegen.','Mit geeigneten Testdaten prüfen und Ergebnisse gemeinsam bewerten.','Bei Freigabe kontrolliert einführen und Verantwortlichkeit dokumentieren.'],'Ein messbarer kleiner Verbesserungsversuch ist leichter zu prüfen als der sofortige Umbau des gesamten Betriebs.')]);
add('course-language','courses','Begriffe wirklich verstehen',['Begriffe mit einem Beispiel verknüpfen.','Ähnliche Wörter bewusst unterscheiden.','Ohne Vorlage erklären zeigt, was hängen geblieben ist.'],'Erkläre Rücklage und Kaution jeweils in einem eigenen Satz.',['Wort','Beispiel','Eigene Erklärung'],'wifi',[
match('Drei Geldtöpfe.','Diese Wörter beschreiben unterschiedliche Zwecke.','Ordne die Begriffe ihren Aufgaben zu.',[['Kaution','Sicherheit aus dem Mietverhältnis'],['Rücklage','Geld der Eigentümergemeinschaft für künftige Aufwendungen'],['Hauptmietzins','Entgelt für die Nutzung der Wohnung']],'Eine ähnliche monatliche Zahlung macht die Zwecke nicht gleich. Kaution, Rücklage und Mietzins bleiben getrennt.'),
n('Vorschreibung ist nicht Zahlung.','Die Vorschreibung fordert einen Betrag an. Ob er bezahlt ist, zeigt der tatsächliche Zahlungseingang.','Eine Vorschreibung wurde automatisch erstellt.','Ist die Forderung dadurch bezahlt?',['Ja, sobald das Dokument erstellt ist.','Nein. Zahlungseingang und Zuordnung gesondert prüfen.','Ja, wenn keine Beschwerde eingeht.'],1,'Eine Forderung und ihre Erfüllung sind zwei unterschiedliche Informationen.'),
n('Verstehen statt Wortlaut.','Eine eigene Erklärung darf einfach sein und muss den Kern treffen.','Du erklärst „Verteilungsschlüssel“.','Welche Erklärung trifft den Begriff?',['Die Regel, nach der bestimmte Kosten aufgeteilt werden.','Die Liste aller bereits bezahlten Rechnungen.','Die Methode, mit der der Mietvertrag unterschrieben wird.'],0,'Eine Kostenregel entscheidet nicht automatisch über deren Zulässigkeit. Erst Kostenart und Rechtsrahmen prüfen, dann korrekt verteilen.')]);
add('course-math','courses','Zahlen in kleinen Schritten',['Rechenbasis und Einheit zuerst klären.','Anteile werden nach dem richtigen Schlüssel gerechnet.','Der Saldo vergleicht Kosten und Vorauszahlungen.'],'Rechne eine kleine anonymisierte Abrechnung nach und erkläre den Saldo.',['Gesamt','Anteil','Ergebnis'],'mrg',[
calc('Ein Anteil am Beispiel.','Wenn der anwendbare Schlüssel feststeht, kannst du den Anteil berechnen.','Im erfundenen Beispiel trägt eine Einheit 10 % von insgesamt 2.400 € zulässigen Kosten.','Wie hoch ist ihr Anteil?',240,'10 % von 2.400 € sind 240 €. Ob 10 % der richtige Schlüssel sind, ist im echten Fall vorher zu prüfen.',['2.400 €','10 %','Anteil']),
calc('Eine Nachzahlung.','Sind die tatsächlichen Kosten höher als die Vorauszahlungen, ergibt sich rechnerisch eine Nachzahlung.','Im Beispiel: 1.920 € Kostenanteil und 1.800 € Vorauszahlungen.','Wie hoch ist die rechnerische Nachzahlung?',120,'1.920 − 1.800 = 120 €. Fälligkeit und zahlungspflichtige Person hängen vom konkreten Rechtsrahmen ab.',['Kosten','Vorauszahlung','Saldo']),
calc('Zwei Positionen zusammen.','Rechne nur mit vergleichbaren Beträgen. Steuerbasis und Zeitraum müssen zusammenpassen.','Ein Übungsbeleg enthält 180 € Arbeit und 45 € Material. Weitere Positionen lassen wir weg.','Wie hoch ist die Summe?',225,'180 + 45 = 225 €. Im echten Beleg kommen gegebenenfalls Steuern oder weitere vereinbarte Positionen hinzu.',['Arbeit','Material','Summe'])]);
add('course-law','courses','Rechtsfälle lesen lernen',['Eine Fallfrage braucht den passenden Rechtsrahmen.','Konkrete Daten sind besser als Schlagwörter.','Unklarheiten als Frage notieren statt raten.'],'Erstelle für einen Übungsfall eine kurze Liste der noch fehlenden Informationen.',['Sachverhalt','Rechtsrahmen','Nächster Schritt'],'mrg',[
sort('Eine Fallfrage zerlegen.','Eine strukturierte Falllösung beginnt mit dem Sachverhalt.','Du sollst eine mietrechtliche Rückfrage vorbereiten.',['Relevante Informationen zu Haus, Vertrag und Anliegen sammeln.','Anwendbaren Rechtsrahmen und aktuelle Regel prüfen.','Den Fall fachlich einordnen und den nächsten Schritt erklären.'],'Die richtige Reihenfolge verhindert, dass eine gefundene Regel auf das falsche Haus angewendet wird.'),
n('Ein Datum ist eine Information.','Fragen zu Fristen brauchen konkrete Daten und den Rechtsrahmen.','Eine Kursfrage nennt eine Betriebskostenabrechnung, aber kein anwendbares Mietrecht.','Welche Rückfrage hilft?',['Gilt hier der betreffende MRG-Rahmen und welcher Zeitraum ist betroffen?','Welche Farbe hat die Wohnungstür?','Wie sympathisch ist der Eigentümer?'],0,'Eine präzise Rückfrage ist Teil der Falllösung. Ohne Rechtsrahmen lässt sich eine Frist nicht beliebig übertragen.'),
n('Lernen mit einer Quelle.','Für österreichische Rechtsfragen nutze die aktuelle österreichische Vorschrift. Eine deutsche Anleitung ist nicht automatisch übertragbar.','Eine Suche zeigt ein deutsches WEG-Beispiel.','Was ist für deinen Wiener Fall sinnvoll?',['Die Begriffe übernehmen, weil beide Länder Deutsch sprechen.','Die österreichische Rechtslage und den konkreten Fall prüfen.','Die Regel nur dann übernehmen, wenn die Rechnung in Euro ist.'],1,'Gleich klingende Begriffe können unterschiedliche Regeln haben. Quellen und Geltungsbereich immer mitlesen.')]);
add('course-assist','courses','WIFI oder BFI vorbereiten',['Assistenzkurse unterstützen den Berufseinstieg.','Anbieterabschluss und Gewerbezugang sind verschiedene Dinge.','Kurswahl passt zu deinem Lernziel und Zeitplan.'],'Vergleiche bei einem Assistenzkurs Inhalt, Ablauf und Prüfungsbedingungen.',['Kurs','Anbieterprüfung','Berufseinstieg'],'wifi',[
n('Ein Kurs für den Einstieg.','WIFI Wien und BFI Wien bieten Ausbildungen für Immobilienverwaltungsassistenz an. Sie behandeln Grundlagen und praktische Abläufe.','Du möchtest begleitet in der Familienfirma mitarbeiten.','Welche Ausbildung passt zunächst zu diesem Ziel?',['Ein Assistenzlehrgang mit passenden Grundlagen.','Ein Kurs zur Wohnungsfotografie als alleinige Vorbereitung.','Ein Bauträgerkurs nur wegen des ähnlichen Namens.'],0,'Die aktuellen Inhalte, Termine und Bedingungen stehen beim Anbieter. Ein Kursname allein sagt noch nicht, ob der Ablauf für dich passt.'),
n('Zertifikat ist nicht Gewerbeberechtigung.','Ein Assistenzzertifikat zeigt einen bestimmten Ausbildungsstand. Es ersetzt nicht den Gewerbezugang für selbstständige Immobilienverwaltung.','Du bestehst eine Anbieterprüfung für Immobilienverwaltungsassistenz.','Was hast du damit sicher erreicht?',['Eine automatische Berechtigung zur eigenen Hausverwaltung.','Den betreffenden Ausbildungsabschluss nach den Anbieterbedingungen.','Die Übertragung der Familienfirma auf deinen Namen.'],1,'Anbieterabschluss, Befähigungsprüfung und Gewerbeberechtigung sind getrennte Fragen. Prüfungen und Zusatzkosten beim Anbieter klären.'),
n('Förderung vorher klären.','AMS-Förderung hängt von deiner Situation und der Bewilligung ab. Eine Kurslistung ist keine Förderzusage.','Du möchtest einen kostenpflichtigen Lehrgang buchen.','Wie klärst du eine mögliche AMS-Unterstützung?',['Erst den Kurs bezahlen, dann mit Förderung rechnen.','Nur nach dem AMS-Logo auf der Website suchen.','Vor Kursbeginn Angebote und Voraussetzungen mit dem AMS klären.'],2,'Während einer Beschäftigung gelten andere Fördermöglichkeiten als bei Arbeitslosigkeit. Prüfe zusätzlich passende Wiener Bildungsangebote, ohne mit einer Zusage zu rechnen.')]);
add('course-exam','courses','Befähigung & Praxis einordnen',['Ein technischer Abschluss ist kein automatischer Verwalter-Nachweis.','Prüfungsantritt und Gewerbezugang getrennt klären.','Tätigkeiten und Ausbildung bestimmen den passenden Weg.'],'Lass mit WKO oder Behörde deinen Ausbildungs- und Praxisweg einordnen.',['Ausbildung','Verwalterpraxis','Gewerbezugang'],'ris',[
n('Dein Abschluss hilft anders.','Technische Erfahrung hilft bei Systemen, Daten und Prozessen. Ein technischer Bachelor ist aber nicht automatisch ein immobilienfachlicher Befähigungsnachweis.','Du hast einen technischen BSc und möchtest gewerberechtlich verantwortlich werden.','Was ist der richtige nächste Schritt?',['Den BSc als automatische Gewerbeberechtigung behandeln.','Den konkreten Ausbildungsweg und die fachliche Praxis mit WKO und Behörde prüfen.','Nur das Firmenlogo auf deinen Namen ändern.'],1,'Auch frühere Schulabschlüsse können relevant sein. Keine feste persönliche Praxisdauer zusagen, bevor der gesamte Ausbildungsweg eingeordnet ist.'),
match('Drei verschiedene Stationen.','Vorbereitung, Prüfungsantritt und Gewerbezugang erfüllen unterschiedliche Zwecke.','Ordne die Stationen zu.',[['Vorbereitungslehrgang','Lernstoff und Prüfungstraining'],['Befähigungsprüfung','Formale Prüfung der Kenntnisse'],['Gewerbezugang','Nachweis der geltenden Voraussetzungen']],'Die Volljährigkeit reicht grundsätzlich für den Prüfungsantritt; der Gewerbezugang ist gesondert zu prüfen. Berufspraxis ist nicht pauschal eine Voraussetzung für die Prüfungsanmeldung.'),
n('Was als Praxis zählt.','Die Verordnung beschreibt für Verwalterpraxis eigenständige kaufmännische und verwaltungstechnische Aufgaben als Hausverwaltungskraft.','Du arbeitest überwiegend als Entwickler und schaust manchmal bei Verwaltungsfällen zu.','Ist das automatisch die geforderte Verwalterpraxis?',['Ja, wenn du in einem Immobilienunternehmen angestellt bist.','Ja, wenn die Firma deiner Familie gehört.','Nein. Konkrete Tätigkeit und Eigenständigkeit prüfen und nachweisen.'],2,'Die fachliche Tätigkeit muss tatsächlich ausgeübt werden. Dokumentiere Zeitraum, Aufgaben und Verantwortung und kläre die Anerkennung frühzeitig.')]);
add('course-learning','courses','Ein Lernrhythmus, der passt',['Ein kleines klares Ziel ist genug für eine Einheit.','Abrufen zeigt mehr als bloßes Wiederlesen.','Fehler werden ohne Druck wiederholt.'],'Plane eine kurze Einheit und notiere eine Frage für eine erfahrene Person.',['Klein anfangen','Selbst abrufen','Später wiederholen'],'wifi',[
n('Eine Aufgabe als Ziel.','Ein kleines Lernziel reduziert die Menge auf dem Bildschirm und macht einen Abschluss greifbar.','Du hast heute wenig Konzentration.','Welches Ziel ist überschaubar?',['Alle Rechtskapitel heute beenden.','Eine Kostenposition verstehen und eine Aufgabe dazu lösen.','Eine Stunde alles ohne Pause wiederlesen.'],1,'Eine einzelne sinnvolle Aufgabe ist ein vollständiger kleiner Lernschritt. Umfang und Tempo darfst du anpassen.'),
n('Kurz selbst erklären.','Wenn du einen Begriff ohne Vorlage erklärst, bemerkst du schneller, was noch unklar ist.','Du hast gerade „Rücklage“ gelesen.','Wie prüfst du dein Verständnis?',['Das Wort ohne Vorlage erklären und danach vergleichen.','Nur die Seite erneut überfliegen.','Die Länge der Erklärung messen.'],0,'Du brauchst keine perfekte Definition. Ein richtiger Zweck und ein eigenes Beispiel reichen für den ersten Verständnischeck.'),
n('Ein Fehler ist ein Hinweis.','Eine falsche Antwort wird zur Wiederholungsaufgabe. Durchgearbeitet und sicher beantwortet sind verschiedene Dinge.','Du verwechselst Kaution und Rücklage.','Was hilft beim nächsten Versuch?',['Die Aufgabe als beherrscht markieren.','Die gesamte Kategorie von vorn lesen müssen.','Die beiden Zwecke mit einem Beispiel unterscheiden und später abrufen.'],2,'Die App merkt sich Aufgaben zum Wiederholen. Du bestimmst, wann du sie erneut versuchst. Der Fortschritt ist keine Berufszulassung.')]);
add('owner-roles','ownership','Drei Rollen in der Firma',['Eigentum, Unternehmensführung und Gewerbeverantwortung unterscheiden.','Eine GmbH braucht eine geeignete gewerberechtliche Geschäftsführung.','Ein Anteilsübergang ersetzt keine fachliche Prüfung.'],'Lass dir erklären, wer heute welche Rolle und Zeichnungsbefugnis hat.',['Eigentum','Unternehmensführung','Gewerbeverantwortung'],'roles',[
match('Wer hat welche Aufgabe?','Eine Person kann mehrere Rollen haben. Trotzdem bleiben die Funktionen unterschiedlich.','Ordne die Funktionen in einer GmbH zu.',[['Gesellschafter','Hält Anteile an der Gesellschaft'],['Handelsrechtlicher Geschäftsführer','Leitet und vertritt die Gesellschaft'],['Gewerberechtlicher Geschäftsführer','Verantwortet die gewerberechtliche Ausübung']],'Die gewerberechtliche Geschäftsführung muss tatsächlich die Anforderungen erfüllen und tätig sein. Sie ist nicht bloß ein Name für ein Formular.'),
n('Eigentum allein genügt nicht.','Du kannst Anteile erhalten, ohne dadurch automatisch persönlich fachlich befähigt zu sein. Der Gewerbeinhaber und die verantwortlichen Rollen müssen klar bleiben.','Du übernimmst Anteile einer bestehenden Hausverwaltungs-GmbH.','Was muss für den laufenden Betrieb geklärt bleiben?',['Wer die fachlich geeignete gewerberechtliche Geschäftsführung übernimmt.','Nur, wer das Logo gestaltet.','Dass Verwandtschaft den Befähigungsnachweis ersetzt.'],0,'Die GmbH kann als Gewerbeinhaberin bestehen bleiben. Rollen, Änderungen und etwaige Meldepflichten gehören trotzdem fachlich geprüft.'),
n('Eine echte verantwortliche Person.','Die gewerberechtliche Geschäftsführung braucht fachliche Voraussetzungen, tatsächliche Tätigkeit und die erforderlichen Befugnisse.','Jemand bietet an, lediglich seinen Namen für die Firma bereitzustellen.','Was ist dazu richtig?',['Das genügt, wenn die Person ein Zertifikat besitzt.','Die Anforderungen und die tatsächliche Funktion müssen erfüllt sein.','Ein mündlicher Familienbeschluss ersetzt alle Voraussetzungen.'],1,'Je nach Rechtsform und Stellung gelten konkrete Anforderungen. Lass die tatsächliche Bestellung und Rolle von zuständigen Fachleuten prüfen.')]);
add('owner-transfer','ownership','Übernahme Schritt für Schritt',['Zuerst Rechtsform und Übernahmeart klären.','Eine GmbH-Anteilsübernahme ist etwas anderes als ein Einzelunternehmensübergang.','Befugnisse, Pflichten und Übergabe werden konkret geprüft.'],'Erstellt gemeinsam eine kurze Übersicht der geplanten Übernahme und der offenen Fragen.',['Rechtsform','Übernahmeart','Pflichten'],'takeover',[
n('Was wird übernommen?','Bei einer Anteilsübernahme bleibt die Gesellschaft grundsätzlich dieselbe. Beim Übergang eines Einzelunternehmens ändert sich der Rechtsträger.','In der Familie heißt es nur: „Du übernimmst die Firma.“','Welche Frage kommt zuerst?',['Ist ein Anteilsübergang oder eine Übertragung des Betriebs geplant?','Wie viele Visitenkarten bestellt werden sollen.','Ob der Nachname gleich bleibt.'],0,'Diese Unterscheidung beeinflusst Gewerbe, Verträge, Haftung und die Gestaltung. Die konkrete Umsetzung braucht eine fachlich begleitete Prüfung.'),
sort('Die geplante Übergabe.','Eine geplante Übernahme braucht einen abgestimmten Ablauf. Das ist ein Lernmodell, kein Rechtsfahrplan für jeden Fall.','Du bereitest mit der Familie eine schrittweise Übergabe vor.',['Rechtsform, Ziele und aktuellen Stand gemeinsam erfassen.','Mit Beratung Berechtigung, Verträge, Haftung und Rollen prüfen.','Vereinbarte Schritte mit Verantwortlichen und Terminen umsetzen.'],'WKO, Rechtsberatung und Steuerberatung können unterschiedliche Teile begleiten. Ungeprüftes „Weiterlaufenlassen“ ist kein Übergabeplan.'),
n('Verträge nicht einfach annehmen.','Ob Verträge fortbestehen, übertragen werden oder Zustimmung brauchen, hängt von der konkreten Gestaltung ab.','Ein neuer Rechtsträger soll künftig Verwaltungsaufträge bearbeiten.','Was ist sinnvoll?',['Alle bisherigen Vollmachten ungeprüft weiterverwenden.','Vertragsübergang, Vertretungsbefugnis und Informationspflichten prüfen lassen.','Nur die neue E-Mail-Adresse mitteilen.'],1,'Verwaltungsmandate, Dienstleisterverträge und Beschäftigungsverhältnisse müssen passend zur Übernahmeart betrachtet werden.')]);
add('owner-family','ownership','Familie & Zusammenarbeit',['Erwartungen und Aufgaben konkret besprechen.','Eigentümerrolle und tägliche Arbeit unterscheiden.','Rückmeldungen und Entscheidungen erhalten einen festen Rahmen.'],'Vereinbart für die erste Zeit eine kleine Aufgabe, Betreuung und ein regelmäßiges Gespräch.',['Aufgabe','Befugnis','Rückmeldung'],'roles',[
n('Was heißt „einsteigen“?','Ein Einstieg wird leichter, wenn Aufgaben, verfügbare Zeit, Betreuung und Freigaben konkret vereinbart werden.','Die Familie sagt: „Du hilfst ab nächster Woche mit.“','Was klärst du?',['Welche Aufgaben du übernimmst und wer deine Arbeit begleitet.','Dass du ab sofort jede Ausgabe freigeben darfst.','Nur den Namen auf deiner E-Mail-Signatur.'],0,'Eine klare Rolle schützt vor Missverständnissen. Auch Bezahlung, Beschäftigungsform und tatsächliche Befugnisse brauchen passende Vereinbarungen.'),
n('Ein fester Gesprächsrahmen.','Fachliche Fragen und Familienkonflikte lassen sich leichter trennen, wenn Entscheidungen im Betrieb nachvollziehbar besprochen werden.','Bei jedem gemeinsamen Abendessen werden ungeklärte Arbeitsfragen verhandelt.','Was könnte helfen?',['Alle betrieblichen Entscheidungen informell lassen.','Ein vereinbartes kurzes Arbeitsgespräch mit offenen Fragen und Entscheidungen.','Fachliche Rückfragen nur noch per Familienchat klären.'],1,'Ein fester Rahmen schafft Platz für konkrete Rückmeldungen. Er ist ein Organisationsvorschlag, keine verbindliche Familienregel.'),
n('Eine Aufgabe wirklich übertragen.','Wer Verantwortung übernehmen soll, braucht passende Informationen, Unterstützung und Befugnisse.','Du sollst Vorgänge betreuen, darfst aber keinen nächsten Schritt veranlassen.','Welche Frage hilft?',['Warum die Aufgabe noch nicht schneller fertig ist.','Ob du die fehlende Befugnis selbst annehmen kannst.','Welche Entscheidungen du treffen darfst und welche Freigabe nötig ist.'],2,'Verantwortung und Befugnis müssen zusammenpassen. Die rechtliche Vertretung bleibt dabei gesondert zu prüfen.')]);
add('owner-finance','ownership','Firmenzahlen & fremdes Geld',['Kundengelder und Firmenfinanzen strikt unterscheiden.','Umsatz ist nicht gleich Gewinn oder Liquidität.','Planbare Belastungen und Reserven gehören zur Führung.'],'Gehe eine einfache anonymisierte Firmenübersicht mit der verantwortlichen Person durch.',['Umsatz','Kosten','Verfügbares Geld'],'wko',[
calc('Umsatz minus Kosten.','Eine einfache Ergebnisrechnung vergleicht Erlöse und Kosten im gleichen Zeitraum. Sie zeigt noch nicht automatisch den Kontostand.','Erfundenes Monatsbeispiel: 9.000 € Erlöse und 7.200 € Kosten, jeweils auf vergleichbarer Basis. Weitere Positionen bleiben außen vor.','Welcher rechnerische Überschuss ergibt sich?',1800,'9.000 − 7.200 = 1.800 €. Das ist nur dieses vereinfachte Ergebnis, nicht automatisch Gewinn nach Steuern oder frei verfügbares Geld.',['Erlöse','Kosten','Ergebnis']),

Object.assign(TERMS,{'Mandat':'Ein konkreter Auftrag zur Verwaltung. Vertrag und Gesetz bestimmen den Umfang.','Liquidität':'Die Fähigkeit, fällige Zahlungen rechtzeitig aus eigenen verfügbaren Mitteln zu leisten.','Gesellschafter':'Eine Person oder Organisation, die Anteile an einer Gesellschaft hält.','Gewerbeinhaber':'Die natürliche Person oder Gesellschaft, auf die die Gewerbeberechtigung lautet.','Gewerberechtlicher Geschäftsführer':'Die für die gewerberechtliche Ausübung verantwortliche, geeignete Person mit tatsächlichen Aufgaben und Befugnissen.','Vier-Augen-Prinzip':'Ein Ablauf mit getrennten Kontrollpunkten durch zwei entsprechend befugte Personen.','Befähigungsprüfung':'Eine formale Prüfung der beruflichen Kenntnisse. Sie ist nicht automatisch die Gewerbeberechtigung.','Vermögensschadenhaftpflicht':'Versicherung für bestimmte finanzielle Schäden aus beruflicher Tätigkeit, nach den jeweiligen Bedingungen.','Rechtsträger':'Die Person oder Gesellschaft, die rechtlich Betreiberin des Unternehmens ist.','Vertretungsbefugnis':'Die Erlaubnis, für eine andere Person oder Gesellschaft verbindlich zu handeln.','Anfechtung':'Eine rechtlich geregelte Möglichkeit, eine Entscheidung überprüfen zu lassen. Voraussetzungen und Fristen sind zu beachten.','Eigenständigkeit':'Du erledigst fachliche Aufgaben selbst im vereinbarten Rahmen. Nur zuzusehen ist etwas anderes.','Vollmacht':'Die Befugnis, für eine andere Person oder Gesellschaft bestimmte Handlungen vorzunehmen.','Haftung':'Die rechtliche Verantwortung, zum Beispiel für einen verursachten Schaden.','Rechtsform':'Die rechtliche Form eines Unternehmens, etwa Einzelunternehmen oder GmbH.','Rechtsrahmen':'Die Regeln, die für das konkrete Haus, den Vertrag oder den Fall gelten.','Befähigungsnachweis':'Der Nachweis der erforderlichen beruflichen Kenntnisse, Fähigkeiten und Erfahrungen für ein reglementiertes Gewerbe.'});
