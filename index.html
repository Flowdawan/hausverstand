</script><script>'use strict';
const STORAGE_KEY='hausverstand-wien-v2',OLD_KEY='hausverstand-wien-v1';
const moduleById=new Map(COURSE.map(c=>[c.id,c]));
const unitById=new Map(COURSE.flatMap(c=>c.steps.map(u=>[u.id,u])));
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:2,progress:{},last:null,migrated:false});
let appState=fresh(),storageOK=true,migrationNotice=false,view={kind:'home'},exercise=null,result=null;
let reviewDone=0,reviewTotal=0,reviewIds=[],wordLimit=6,previousFocus=null;
function parseStored(text){try{return JSON.parse(text)}catch(e){return null}}
function parseAmount(text){const raw=String(text).trim().replace(/[\s€]/g,'');if(/^-?\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?$/.test(raw))return Number(raw.replace(/\./g,'').replace(',','.'));if(/^-?\d+(?:,\d{1,2})?$/.test(raw))return Number(raw.replace(',','.'));if(/^-?\d+(?:\.\d{1,2})?$/.test(raw))return Number(raw);return null;}
function validCursor(x){return x&&moduleById.has(x.moduleId)&&Number.isInteger(x.index)&&x.index>=0&&x.index<moduleById.get(x.moduleId).steps.length&&['learn','quiz','feedback'].includes(x.stage)}
function loadState(){
 try{
  const data=parseStored(localStorage.getItem(STORAGE_KEY));
  if(data&&data.version===2&&data.progress&&typeof data.progress==='object'){
   for(const [id,p] of Object.entries(data.progress)){if(unitById.has(id)&&p&&typeof p==='object')appState.progress[id]={seen:p.seen===true,correct:p.correct===true?true:p.correct===false?false:null,needsReview:p.needsReview===true&&p.correct!==true};}
   appState.last=validCursor(data.last)?{moduleId:data.last.moduleId,index:data.last.index,stage:data.last.stage==='feedback'?'quiz':data.last.stage}:null;
   appState.migrated=data.migrated===true;return;
  }
  const old=parseStored(localStorage.getItem(OLD_KEY));
  if(old&&typeof old==='object'){
   const completed=Array.isArray(old.completed)?old.completed:[];
   for(let i=0;i<16;i++)for(let j=0;j<3;j++){const seen=completed.includes(i)||old.passed?.[`${i}:${j}`]===true;if(seen)appState.progress[COURSE[i].steps[j].id]={seen:true,correct:null,needsReview:false};}
   if(Number.isInteger(old.chapter)&&old.chapter>=0&&old.chapter<16&&Number.isInteger(old.step)&&old.step>=0&&old.step<3)appState.last={moduleId:COURSE[old.chapter].id,index:old.step,stage:'learn'};
   migrationNotice=Object.keys(appState.progress).length>0;appState.migrated=true;
  }
 }catch(e){storageOK=false}
}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appState))}catch(e){storageOK=false}}
function moduleCount(c){return c.steps.filter(u=>appState.progress[u.id]?.seen).length}
function moduleComplete(c){return moduleCount(c)===c.steps.length}
function categoryStats(id){const modules=COURSE.filter(c=>c.category===id);return {modules,done:modules.filter(moduleComplete).length};}
function reviewQueue(){return COURSE.flatMap(c=>c.steps.map((u,index)=>({c,u,index}))).filter(x=>appState.progress[x.u.id]?.needsReview);}
function nextRecommendation(){
 if(appState.last){const c=moduleById.get(appState.last.moduleId);if(!moduleComplete(c))return {...appState.last};}
 const c=COURSE.find(c=>!moduleComplete(c));if(c)return {moduleId:c.id,index:Math.max(0,c.steps.findIndex(u=>!appState.progress[u.id]?.seen)),stage:'learn'};
 return {moduleId:COURSE[0].id,index:0,stage:'learn'};
}
function annotated(text){let out='',pos=0,count=0;const names=Object.keys(TERMS).sort((a,b)=>b.length-a.length);const pattern=new RegExp('('+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');for(const match of text.matchAll(pattern)){if(count>=2)break;const key=names.find(n=>n.toLocaleLowerCase('de')===match[0].toLocaleLowerCase('de'));out+=esc(text.slice(pos,match.index))+`<button class="term-link" data-action="word" data-word="${esc(key)}">${esc(match[0])}</button>`;pos=match.index+match[0].length;count++;}return out+esc(text.slice(pos));}
function sourceLinks(c,u){const ids=u?.sources||[c.source];return [...new Set(ids)].filter(id=>SOURCE[id]).map(id=>`<a href="${esc(SOURCE[id].url)}" target="_blank" rel="noopener">${esc(SOURCE[id].title)} <span class="sr-only">(öffnet einen neuen Tab)</span></a>`).join('');}
function flow(nodes){return `<div class="concept-flow" aria-label="Drei Begriffe im Überblick">${nodes.map((t,i)=>`${i?'<span class="flow-separator" aria-hidden="true">›</span>':''}<div class="flow-node"><b aria-hidden="true">${i+1}</b><span>${esc(t)}</span></div>`).join('')}</div>`;}
function shortExplanation(text){const sentences=text.match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g)||[text];let out='';for(const part of sentences){if(out&&out.split(/\s+/).length+part.trim().split(/\s+/).length>45)break;out+=part;}return out.trim()||text;}
function focusMain(){const h=$('main').querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:'auto'});}
function hashFor(v){if(v.kind==='category')return `#category/${v.category}/${v.page||0}`;if(v.kind==='learn')return `#learn/${v.moduleId}/${v.index}/${v.stage}`;if(v.kind==='finish')return `#done/${v.moduleId}`;if(v.kind==='review-end')return '#review';return '#home';}
function parseHash(){const a=location.hash.slice(1).split('/');if(a[0]==='category'&&CAT.some(c=>c.id===a[1]))return {kind:'category',category:a[1],page:Number(a[2])||0};if(a[0]==='learn'&&moduleById.has(a[1])){const candidate={moduleId:a[1],index:Number(a[2]),stage:a[3]};if(validCursor(candidate))return {kind:'learn',...candidate,stage:candidate.stage==='feedback'?'quiz':candidate.stage};}if(a[0]==='done'&&moduleById.has(a[1])&&moduleComplete(moduleById.get(a[1])))return {kind:'finish',moduleId:a[1]};return {kind:'home'};}
function navigate(v,replace=false){view=v;history[replace?'replaceState':'pushState']({view:v},'',hashFor(v));render();focusMain();}
function openCategory(id,page=0){if(!CAT.some(c=>c.id===id))throw Error('Kategorie existiert nicht.');exercise=null;result=null;navigate({kind:'category',category:id,page});}
function startModule(id,index,stage='learn',review=false){const c=moduleById.get(id);if(!c)throw Error('Modul existiert nicht.');let n=index;if(n===undefined){n=c.steps.findIndex(u=>!appState.progress[u.id]?.seen);if(n<0)n=0;}if(!Number.isInteger(n)||n<0||n>=c.steps.length)throw Error('Aufgabe existiert nicht.');exercise=null;result=null;navigate({kind:'learn',moduleId:id,index:n,stage,review});return {moduleId:id,title:c.title,index:n,stage};}
function startReview(){reviewDone=0;const queue=reviewQueue();reviewIds=queue.map(x=>x.u.id);reviewTotal=queue.length;if(!queue.length){navigate({kind:'review-end'});return;}startModule(queue[0].c.id,queue[0].index,'quiz',true);}
function ensureExercise(u){if(exercise?.id===u.id)return;exercise={id:u.id,input:'',selected:Array(u.pairs?.length||0).fill(''),order:(u.items||u.answers||u.pairs||[]).map((_,i)=>i)};for(let i=exercise.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[exercise.order[i],exercise.order[j]]=[exercise.order[j],exercise.order[i]];}if(u.kind==='order'&&exercise.order.every((n,i)=>n===i))exercise.order.reverse();}
function renderHome(){
 const next=nextRecommendation(),c=moduleById.get(next.moduleId),seen=Object.values(appState.progress).some(p=>p.seen),all=COURSE.every(moduleComplete);
 const notice=migrationNotice?'<p class="notice">Dein bisheriger Lernfortschritt wurde übernommen.</p>':'';migrationNotice=false;
 $('main').innerHTML=`<div class="eyebrow">DEIN LERNWEG</div><h1>Was möchtest du heute lernen?</h1><p class="intro-text">Eine kleine Aufgabe reicht. Du bestimmst das Tempo.</p>${notice}<div class="resume"><div><small>${all?'WIEDERHOLEN IN DEINEM TEMPO':seen?'WEITER, WO DU GERADE BIST':'DEIN ERSTER SCHRITT'}</small><strong>${esc(c.title)}</strong></div><button data-action="resume">${seen?'Weiterlernen':'Starten'}</button></div><div class="category-grid">${CAT.map(cat=>{const stats=categoryStats(cat.id);return `<button class="category-card ${cat.color}" data-action="category" data-category="${cat.id}"><span class="category-symbol" aria-hidden="true">${cat.symbol}</span><h2>${esc(cat.name)}</h2><p>${esc(cat.description)}</p><div class="category-meta"><span>${stats.done} / ${stats.modules.length} Module bearbeitet</span><span class="small-track" aria-hidden="true"><span style="width:${100*stats.done/stats.modules.length}%"></span></span></div></button>`}).join('')}</div><div class="home-bottom"><button class="link-button" data-action="review">Aufgaben wiederholen${reviewQueue().length?` (${reviewQueue().length})`:''}</button><button class="link-button" data-action="courses">Kursangebote ansehen</button></div>`;
}
function renderCategory(){const cat=CAT.find(c=>c.id===view.category),stats=categoryStats(cat.id),pages=Math.ceil(stats.modules.length/4);view.page=Math.max(0,Math.min(Number.isInteger(view.page)?view.page:0,pages-1));const modules=stats.modules.slice(view.page*4,view.page*4+4);$('main').innerHTML=`<div class="${cat.color}"><div class="crumb"><button class="back" data-action="home">Alle Kategorien</button><span class="cat-label">${stats.done} / ${stats.modules.length} bearbeitet</span></div><div class="eyebrow">${esc(cat.short).toUpperCase()}</div><h1>${esc(cat.name)}</h1><p class="intro-text">${esc(cat.description)}</p><div class="module-list">${modules.map(c=>{const position=stats.modules.indexOf(c)+1,done=moduleComplete(c);return `<button class="module-card ${done?'is-done':''}" data-action="module" data-module="${c.id}"><span class="module-number" aria-hidden="true">${done?'✓':String(position).padStart(2,'0')}</span><span><h2>${esc(c.title)}</h2><p>${moduleCount(c)} / ${c.steps.length} Aufgaben bearbeitet · kleine Lernschritte</p></span></button>`}).join('')}</div><div class="pages"><button class="secondary" data-action="page" data-dir="-1" ${view.page===0?'disabled':''}>Zurück</button><span>Seite ${view.page+1} / ${pages}</span><button class="secondary" data-action="page" data-dir="1" ${view.page===pages-1?'disabled':''}>Weitere Module</button></div>${cat.id==='courses'?'<button class="link-button" data-action="courses">Passende Kursangebote</button>':''}</div>`;}
function detail(c,u,explanation=false){return `<details class="detail"><summary>${explanation?'Mehr zur Erklärung':'Mehr zum Thema'}</summary>${explanation?`<p>${annotated(u.why)}</p>`:'<p>In echten Fällen zählen Haus, Vertrag und der passende Rechtsrahmen. Die Aufgabe ist ein vereinfachtes Lernbeispiel.</p>'}${sourceLinks(c,u)}<p class="small">Informationen geprüft: 05.10.2026. Keine automatische Aktualisierung.</p></details>`;}
function exerciseHTML(u){
 if(u.kind==='choice')return `<div class="answers" role="group" aria-labelledby="question">${exercise.order.map((n,i)=>`<button class="answer" data-action="answer" data-answer="${n}"><b aria-hidden="true">${String.fromCharCode(65+i)}</b><span>${esc(u.answers[n])}</span></button>`).join('')}</div>`;
 if(u.kind==='number')return `<form id="number-form"><label class="field-label" for="number-answer">Dein Ergebnis</label><div class="number-box"><input id="number-answer" inputmode="decimal" autocomplete="off" type="text" placeholder="Betrag" value="${esc(exercise.input)}" aria-describedby="number-unit" required><span id="number-unit">${esc(u.unit)}</span></div><p id="input-error" class="error" role="alert"></p><div class="actions actions-end"><button class="primary" type="submit">Ergebnis prüfen</button></div></form>`;
 if(u.kind==='order')return `<ol class="order-list">${exercise.order.map((n,i)=>`<li class="order-item"><span class="order-index" aria-hidden="true">${i+1}</span><span class="order-text">${esc(u.items[n])}</span><div class="order-buttons"><button data-action="move" data-index="${i}" data-dir="-1" aria-label="Schritt ${i+1} nach oben: ${esc(u.items[n])}" ${i===0?'disabled':''}>↑</button><button data-action="move" data-index="${i}" data-dir="1" aria-label="Schritt ${i+1} nach unten: ${esc(u.items[n])}" ${i===exercise.order.length-1?'disabled':''}>↓</button></div></li>`).join('')}</ol><p class="sr-only" id="order-status" aria-live="polite"></p><div class="actions actions-end"><button class="primary" data-action="check">Reihenfolge prüfen</button></div>`;
 return `<div class="match-list">${u.pairs.map(([term],i)=>`<div class="match-row"><label for="match-${i}">${esc(term)}</label><select id="match-${i}" data-match="${i}" required><option value="">Bitte auswählen</option>${exercise.order.map(n=>`<option value="${n}" ${exercise.selected[i]===String(n)?'selected':''}>${esc(u.pairs[n][1])}</option>`).join('')}</select></div>`).join('')}</div><p id="input-error" class="error" role="alert"></p><div class="actions actions-end"><button class="primary" data-action="check">Zuordnung prüfen</button></div>`;
}
function solutionHTML(u){if(u.kind==='number')return `<p>${u.value.toLocaleString('de-AT')} ${esc(u.unit)}</p>`;if(u.kind==='choice')return `<p>${esc(u.answers[u.correct])}</p>`;return `<${u.kind==='order'?'ol':'ul'} class="solution-list">${(u.kind==='order'?u.items:u.pairs.map(p=>`${p[0]}: ${p[1]}`)).map(t=>`<li>${esc(t)}</li>`).join('')}</${u.kind==='order'?'ol':'ul'}>`;}
function renderLesson(){
 const c=moduleById.get(view.moduleId),u=c.steps[view.index],cat=CAT.find(cat=>cat.id===c.category);if(!view.review){appState.last={moduleId:c.id,index:view.index,stage:view.stage};persist();}if(view.stage==='feedback'&&!result){view.stage='quiz';}ensureExercise(u);
 const stageIndex=['learn','quiz','feedback'].indexOf(view.stage);
 const context=view.review?`Wiederholung ${reviewDone+1} von ${reviewTotal}`:`Aufgabe ${view.index+1} von ${c.steps.length}`;
 let body='';
 if(view.stage==='learn')body=`<h1>${esc(u.title)}</h1><p class="idea">${annotated(u.idea)}</p>${flow(u.visual)}<div class="actions actions-end"><button class="primary" data-action="quiz">Ausprobieren</button></div>${detail(c,u)}`;
 else if(view.stage==='quiz')body=`<h1>${esc(u.title)}</h1><div class="scenario"><small>${c.category==='ownership'?'IM ÜBUNGSBETRIEB':'DEIN ÜBUNGSFALL'}</small><p>${esc(u.scene)}</p></div><p class="question" id="question">${esc(u.question)}</p>${exerciseHTML(u)}<button class="link-button" data-action="explain">Erklärung nochmal ansehen</button>`;
 else {const excerpt=shortExplanation(u.why);body=`<h1>${result.correct?'Gut gelöst.':'Das schauen wir uns kurz an.'}</h1><div class="answer-result ${result.correct?'':'retry'}"><div class="result-label"><span aria-hidden="true">${result.correct?'✓':'↻'}</span>${result.correct?'Deine Antwort passt.':'So passt es:'}</div>${solutionHTML(u)}</div><p class="explanation">${annotated(excerpt)}</p>${!result.correct?'<p class="review-note">Diese Aufgabe bleibt zum Wiederholen gespeichert.</p>':''}<div class="actions">${!result.correct?'<button class="secondary" data-action="retry">Jetzt nochmal</button>':'<span></span>'}<button class="primary" data-action="continue">${view.review?'Nächste Wiederholung':view.index===c.steps.length-1?'Modul abschließen':'Nächste Aufgabe'}</button></div>${detail(c,u,true)}`;}
 $('main').innerHTML=`<div class="learn-wrap ${cat.color}"><div class="crumb"><button class="back" data-action="${view.review?'home':'category'}" data-category="${c.category}">${view.review?'Lernweg':'Module ansehen'}</button><span class="cat-label">${esc(cat.short)}</span></div><section class="learning-card" aria-label="Aktuelle Lernaufgabe"><div class="learning-top"><span>${esc(c.title)}</span><span class="fraction">${context}</span></div><div class="module-track" aria-label="${context}"><span style="width:${100*(view.index+(view.stage==='feedback'?1:0))/c.steps.length}%"></span></div><div class="stage-tabs" aria-label="Aktueller Lernschritt">${['Verstehen','Ausprobieren','Auflösen'].map((name,i)=>`<span class="${i===stageIndex?'active':''}" ${i===stageIndex?'aria-current="step"':''}><b class="stage-number" aria-hidden="true">${i+1}</b>${name}</span>`).join('')}</div><div class="learning-body">${body}</div></section></div>`;
}
function renderFinish(){const c=moduleById.get(view.moduleId),cat=CAT.find(cat=>cat.id===c.category),secure=c.steps.filter(u=>appState.progress[u.id]?.correct===true).length;const next=COURSE.filter(n=>n.category===c.category).find(n=>!moduleComplete(n));$('main').innerHTML=`<div class="learn-wrap ${cat.color}"><div class="crumb"><button class="back" data-action="category" data-category="${c.category}">Module ansehen</button><span class="cat-label">${esc(cat.short)}</span></div><section class="learning-card"><div class="learning-body"><div class="finish-marker" aria-hidden="true">✓</div><div class="eyebrow">MODUL BEARBEITET</div><h1>Das nimmst du mit.</h1><ul class="takeaways">${c.summary.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="practice-box"><span>WENN DU ES IM BETRIEB AUSPROBIEREN MÖCHTEST</span><p>${esc(c.practice)}</p></div><div class="actions"><button class="secondary" data-action="home">Für heute genug</button>${next?`<button class="primary" data-action="module" data-module="${next.id}">Nächstes Modul</button>`:`<button class="primary" data-action="category" data-category="${c.category}">Zur Kategorie</button>`}</div><p class="finish-meta">${secure} / ${c.steps.length} Aufgaben richtig beantwortet. Durchgearbeitet heißt nicht automatisch beherrscht.</p><button class="link-button" data-action="module" data-module="${c.id}" data-restart="true">Dieses Modul erneut üben</button></div></section></div>`;}
function renderReviewEnd(){const pending=reviewQueue().length;$('main').innerHTML=`<section class="review-empty"><div class="finish-marker" aria-hidden="true">${reviewDone?'✓':'↻'}</div><div class="eyebrow">WIEDERHOLEN</div><h1>${reviewDone?'Für diese Runde geschafft.':'Gerade nichts offen.'}</h1><p>${pending?`${pending} Aufgaben bleiben für eine spätere Runde gespeichert.`:'Hier erscheinen Aufgaben, die du falsch beantwortet hast. Du kannst auch jedes Modul freiwillig erneut üben.'}</p><button class="primary" data-action="home">Zum Lernweg</button>${pending?'<br><button class="link-button" data-action="review">Neue Runde starten</button>':''}</section>`;}
function render(){document.body.classList.toggle('learning',view.kind==='learn');if(view.kind==='home')renderHome();else if(view.kind==='category')renderCategory();else if(view.kind==='learn')renderLesson();else if(view.kind==='finish')renderFinish();else renderReviewEnd();}
function submitAnswer(n){if(view.kind!=='learn'||view.stage!=='quiz')return;const u=moduleById.get(view.moduleId).steps[view.index];let correct=false;if(u.kind==='choice'){if(!Number.isInteger(n)||n<0||n>=u.answers.length)throw Error('Ungültige Antwort.');correct=n===u.correct;}else if(u.kind==='number'){
 const amount=parseAmount(exercise.input);if(amount===null||!Number.isFinite(amount)){ $('input-error').textContent='Bitte gib eine Zahl ein, zum Beispiel 120, 120,50 oder 1.800.';$('number-answer').setAttribute('aria-invalid','true');return;}correct=Math.abs(amount-u.value)<0.005;
 }else if(u.kind==='order')correct=exercise.order.every((n,i)=>n===i);else {if(exercise.selected.some(n=>n==='')){$('input-error').textContent='Wähle bitte für jeden Begriff eine Erklärung aus.';return;}correct=exercise.selected.every((n,i)=>Number(n)===i);}
 const previous=appState.progress[u.id];appState.progress[u.id]={seen:true,correct:correct||previous?.correct===true,needsReview:!correct};if(!correct)appState.progress[u.id].correct=false;result={correct};view.stage='feedback';persist();navigate({...view},true);
}
function nextStep(){if(view.kind!=='learn'||view.stage!=='feedback'||!result)return;const c=moduleById.get(view.moduleId);if(view.review){reviewDone++;const nextId=reviewIds[reviewDone];if(!nextId){navigate({kind:'review-end'},true);return;}const nextModule=COURSE.find(m=>m.steps.some(u=>u.id===nextId)),index=nextModule.steps.findIndex(u=>u.id===nextId);exercise=null;result=null;navigate({kind:'learn',moduleId:nextModule.id,index,stage:'quiz',review:true},true);return;}if(view.index+1<c.steps.length){exercise=null;result=null;navigate({...view,index:view.index+1,stage:'learn'},true);}else{appState.last=null;persist();navigate({kind:'finish',moduleId:c.id},true);}}
function setStage(stage,reset=false){if(view.kind!=='learn')return;if(stage==='quiz'){result=null;if(reset)exercise=null;}navigate({...view,stage},true);}
function openDialog(title,html){const alreadyOpen=$('dialog').open;if(!alreadyOpen)previousFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-content').innerHTML=html;if(!alreadyOpen)$('dialog').showModal();}
function closeDialog(){ $('dialog').close();}
function showWord(word){if(!Object.hasOwn(TERMS,word))return;openDialog(word,`<p>${esc(TERMS[word])}</p><button class="link-button" data-modal="words">Alle Wörter ansehen</button>`);}
function showWords(){wordLimit=6;openDialog('Wörter einfach erklärt','<label class="field-label" for="word-search">Welches Wort suchst du?</label><input class="search-input" type="search" id="word-search" placeholder="Zum Beispiel Rücklage"><div id="word-results"></div>');renderWords();}
function renderWords(){const input=$('word-search');if(!input)return;const q=input.value.trim().toLocaleLowerCase('de');const matches=Object.entries(TERMS).filter(([t,d])=>(t+' '+d).toLocaleLowerCase('de').includes(q));$('word-results').innerHTML=matches.slice(0,wordLimit).map(([t,d])=>`<div class="word"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')+(matches.length>wordLimit?'<button class="link-button" data-modal="more-words">Weitere Wörter</button>':'')+(!matches.length?'<p class="muted">Dazu ist noch kein Begriff hinterlegt.</p>':'');}
function showCourses(){openDialog('Kurse für deinen nächsten Schritt',`<p class="small muted">Die App bereitet vor. Für Inhalte, Termine und Voraussetzungen zählt das aktuelle Angebot des Anbieters.</p><article class="course-resource"><h3>Immobilienverwaltungsassistenz</h3><p>Für Grundlagen und begleitete Mitarbeit. Ein Anbieterzertifikat ist keine Gewerbeberechtigung.</p><a href="${SOURCE.wifi.url}" target="_blank" rel="noopener">WIFI Wien</a> · <a href="${SOURCE.bfi.url}" target="_blank" rel="noopener">BFI Wien</a></article><article class="course-resource"><h3>Befähigungsprüfung vorbereiten</h3><p>Für die spätere Vertiefung. Prüfung und Gewerbezugang getrennt klären; WIFI empfiehlt Branchenerfahrung.</p><a href="${SOURCE.exam.url}" target="_blank" rel="noopener">Vorbereitungslehrgang am WIFI Wien</a></article><article class="course-resource"><h3>Förderung im Einzelfall klären</h3><p>AMS-Unterstützung ist keine automatische Zusage. Vor Kursbeginn die persönliche Situation und Bedingungen prüfen.</p><a href="${SOURCE.ams.url}" target="_blank" rel="noopener">AMS-Kursförderung</a> · <a href="${SOURCE.ugp.url}" target="_blank" rel="noopener">Gründungsprogramm</a></article>`);}
function showSources(){openDialog('Quellen & Lernhinweise',`<p class="small muted">Grundlagen für Österreich mit Schwerpunkt Wien. Vereinfachte Lernfälle ersetzen weder fachliche Beratung noch Gewerbeberechtigung. Beispiele sind keine Firmen- oder Tarifdaten.</p><div class="source-list">${Object.values(SOURCE).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('')}</div><p class="small muted">Stand der inhaltlichen Prüfung: 05.10.2026. Quellen werden nicht automatisch aktualisiert.</p>`);}
function showProgress(){const progress=Object.values(appState.progress);openDialog('Dein Lernfortschritt',`<div class="stat-grid"><div class="stat"><strong>${COURSE.filter(moduleComplete).length} / ${COURSE.length}</strong><span>Module bearbeitet</span></div><div class="stat"><strong>${progress.filter(p=>p.correct===true).length}</strong><span>Aufgaben zuletzt richtig beantwortet</span></div></div><p class="small muted">${progress.filter(p=>p.seen).length} Aufgaben bearbeitet. Alte Lernstände wurden übernommen; ohne bekannte Antwort werden sie nicht als richtig gewertet.</p><p class="storage-status">${storageOK?'Fortschritt wird nur in diesem Browser gespeichert. Kein Abgleich zwischen Geräten.':'Speichern ist hier nicht möglich. Dein Fortschritt gilt nur für diese geöffnete Seite.'}</p><button class="link-button warning-button" data-modal="reset">Fortschritt zurücksetzen</button>`);}
function showMenu(){openDialog('Was brauchst du?',`<div class="menu-list"><button data-modal="home">Zum Lernweg</button><button data-modal="review">Aufgaben wiederholen</button><button data-modal="progress">Lernfortschritt ansehen</button><button data-modal="courses">Kursangebote</button><button data-modal="sources">Quellen & Lernhinweise</button></div>`);}
function resetConfirmation(){openDialog('Fortschritt zurücksetzen?',`<p>Dein Lernstand in diesem Browser wird gelöscht. Die Lerninhalte bleiben verfügbar.</p><div class="actions"><button class="secondary" data-modal="cancel-reset">Abbrechen</button><button class="primary" data-modal="confirm-reset">Zurücksetzen</button></div>`);}
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='home'){exercise=null;result=null;navigate({kind:'home'});}else if(a==='resume'){const next=nextRecommendation();startModule(next.moduleId,next.index,next.stage);}else if(a==='category')openCategory(b.dataset.category);else if(a==='module')startModule(b.dataset.module,b.dataset.restart==='true'?0:undefined);else if(a==='page')openCategory(view.category,view.page+Number(b.dataset.dir));else if(a==='quiz')setStage('quiz');else if(a==='explain')setStage('learn');else if(a==='answer')submitAnswer(Number(b.dataset.answer));else if(a==='check')submitAnswer();else if(a==='continue')nextStep();else if(a==='retry')setStage('quiz',true);else if(a==='review')startReview();else if(a==='word')showWord(b.dataset.word);else if(a==='courses')showCourses();else if(a==='move'){
 const index=Number(b.dataset.index),dir=Number(b.dataset.dir),target=index+dir;if(target<0||target>=exercise.order.length)return;[exercise.order[index],exercise.order[target]]=[exercise.order[target],exercise.order[index]];render();const moved=$('main').querySelector(`[data-action="move"][data-index="${target}"][data-dir="${dir}"]`);const focus=moved&&!moved.disabled?moved:$('main').querySelector(`[data-action="move"][data-index="${target}"][data-dir="${-dir}"]`);focus?.focus({preventScroll:true});$('order-status').textContent=`Schritt auf Position ${target+1} verschoben.`;
}});
$('main').addEventListener('input',e=>{if(e.target.id==='number-answer'){exercise.input=e.target.value;e.target.removeAttribute('aria-invalid');$('input-error').textContent='';}});
$('main').addEventListener('change',e=>{if(e.target.matches('[data-match]')){exercise.selected[Number(e.target.dataset.match)]=e.target.value;$('input-error').textContent='';}});
$('main').addEventListener('submit',e=>{if(e.target.id==='number-form'){e.preventDefault();submitAnswer();}});
$('dialog-content').addEventListener('input',e=>{if(e.target.id==='word-search'){wordLimit=6;renderWords();}});
$('dialog-content').addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;const a=b.dataset.modal;if(a==='more-words'){wordLimit+=6;renderWords();return;}if(a==='words')showWords();else if(a==='courses')showCourses();else if(a==='sources')showSources();else if(a==='progress'||a==='cancel-reset')showProgress();else if(a==='reset')resetConfirmation();else if(a==='confirm-reset'){appState=fresh();exercise=null;result=null;try{localStorage.removeItem(OLD_KEY)}catch(e){storageOK=false}persist();closeDialog();navigate({kind:'home'});}else if(a==='home'){closeDialog();navigate({kind:'home'});}else if(a==='review'){closeDialog();startReview();}});
$('brand').addEventListener('click',e=>{e.preventDefault();navigate({kind:'home'});});$('words').onclick=showWords;$('menu').onclick=showMenu;$('close-dialog').onclick=closeDialog;
$('dialog').addEventListener('close',()=>{if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});});
$('dialog').addEventListener('click',e=>{if(e.target!==$('dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();});
window.addEventListener('popstate',e=>{view=parseHash();exercise=null;result=null;render();focusMain();});
loadState();persist();view=parseHash();render();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const register=t=>{try{Promise.resolve(document.modelContext.registerTool(t,{signal:lifecycle.signal})).catch(()=>{});}catch(e){}};register({name:'get_learning_progress',description:'Liest aktuelles Modul, bearbeitete Aufgaben und Wiederholungsbedarf.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({moduleId:view.moduleId||null,completedModules:COURSE.filter(moduleComplete).map(c=>c.id),totalModules:COURSE.length,reviewTasks:reviewQueue().length})});register({name:'start_learning_chapter',description:'Öffnet ein Lernmodul, ohne Aufgaben zu beantworten. Kapitel werden ab 0 gezählt.',inputSchema:{type:'object',properties:{chapter:{type:'integer',minimum:0,maximum:COURSE.length-1}},required:['chapter'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!Number.isInteger(input?.chapter)||input.chapter<0||input.chapter>=COURSE.length)throw Error('Ungültiges Kapitel.');return startModule(COURSE[input.chapter].id);}});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script></body></html>
